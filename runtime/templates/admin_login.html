<!doctype html>
<html lang="{{ ui_lang|e }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ msg("UI_ADMIN_LOGIN_PAGE_TITLE") }}</title>
<style>
body{font:14px system-ui;display:flex;align-items:center;justify-content:center;
     min-height:80vh;margin:0;background:#fafafa;color:#17201d}
form{background:#fff;padding:1.5rem;border:1px solid #d6dbd8;border-radius:.5rem;
     width:min(340px,calc(100vw - 3rem));box-sizing:border-box}
h1{font-size:1.1em;margin:0 0 .45rem}
p{line-height:1.45}.intro{margin:0 0 1rem;color:#52605b}
label{display:block;font-weight:600;margin-bottom:.35rem}
input[type=password]{width:100%;padding:.55rem;font:inherit;font-family:monospace;
     box-sizing:border-box;border:1px solid #b9c1bd;border-radius:.3rem}
button{margin-top:.8rem;padding:.5rem 1rem;font:inherit;cursor:pointer}
.err{color:#9b2226;margin-top:.6rem;font-size:.9em}
.muted{color:#68756f;font-size:.85em;margin-top:.8rem}
</style>
</head>
<body>
<form method="post" action="/admin/login" autocomplete="off">
  <h1>{{ msg("UI_ADMIN_LOGIN_HEADING") }}</h1>
  <p class="intro">{{ msg("UI_ADMIN_LOGIN_INTRO") }}</p>
  <input type="hidden" name="next" value="{{ next_path|e }}">
  <label for="admin-key">{{ msg("UI_ADMIN_LOGIN_KEY_LABEL") }}</label>
  <input id="admin-key" type="password" name="key" autocomplete="current-password"
         autofocus required>
  <button type="submit">{{ msg("UI_ADMIN_LOGIN_SUBMIT") }}</button>
  {% if error_key %}<div class="err" role="alert">{{ msg(error_key) }}</div>{% endif %}
  <div class="muted">{{ msg("UI_ADMIN_LOGIN_KEY_HINT") }}</div>
</form>
</body>
</html>
