role: synt_tests
tier: middle
lang: en
style: definitional
version: 2
owner: roberto
updated: 2026-09-12
sha_prev: "6cc75382cbfa4aa82"

section:
  name: synt_tests
  header: "Stage 3 TESTS of synt-multistage"
  preamble: "One JSON object only, without prose, markdown or comments."
context:
  decisions_locked:
    name: "{{ name }}"
    args_required: "{{ args_required }}"
    args_properties_summary: "{{ args_properties_summary }}"
    capabilities: "{{ capabilities }}"
    revertible: "{{ revertible }}"
    reverse_pattern: "{{ reverse_pattern }}"
  user_request: "{{ user_request }}"
rules:
  - name: test_count
    body: "Produce 4-6 tests with unique names."
  - name: declarative_only
    body: |
      MUST: use only name, input and expect, with at least one expectation.
      MUST NOT: emit setup, teardown, env, reference, shell commands or dependencies on host network, keys or data.
      OK: {"name":"empty_list","input":{"entries":[]},"expect":{"ok":true,"ok_count_eq":0}}.
      ERROR: preparing or cleaning up files through shell, even with an empty string.
  - name: private_fixture
    body: "Each case gets a fresh private environment without network: fixture/input.txt contains \"birth fixture\\\\n\", fixture/empty.txt is empty and fixture/output is an empty directory. Use paths relative to this environment when files are needed; other inputs are concrete data. Host files are unavailable."
  - name: mandatory_cases
    body: "One item, empty list when applicable, invalid arguments and a domain edge case."
output_schema:
  type: object
  required: [tests]
  properties:
    tests:
      type: array
      minItems: 4
      maxItems: 6
      items:
        type: object
        additionalProperties: false
        required: [name, input, expect]
        properties:
          name: {type: string}
          input: {type: object}
          expect:
            type: object
            minProperties: 1
            additionalProperties: false
            properties:
              ok: {type: boolean}
              ok_count_eq: {type: integer}
              fail_count_eq: {type: integer}
              error_contains: {type: string}
examples:
  - name_for: change_texts
    note: "Shape only: do not copy names, input or expectations literally."
    output:
      tests:
        - {"name":"one_item","input":{"entries":["Ab"]},"expect":{"ok":true,"ok_count_eq":1}}
        - {"name":"empty_list","input":{"entries":[]},"expect":{"ok":true,"ok_count_eq":0}}
        - {"name":"invalid_type","input":{"entries":42},"expect":{"ok":false,"error_contains":"list"}}
        - {"name":"empty_text","input":{"entries":[""]},"expect":{"ok":true,"ok_count_eq":1}}
footer:
  instruction: "NOW produce the JSON for {{ name }}. ONLY JSON."
