# Frontmatter equivalente a `{# --- ... --- #}` Jinja (CLAUDE.md §6.1).
role: planner
tier: middle
lang: it
style: prescriptive
version: 1
owner: roberto
updated: 2026-05-15
sha_prev: ""

section:
  name: scheduled_tasks
  header: "TASK RICORRENTI / TIMER / PROMEMORIA Metnos (NON eventi calendar, NON processi sistema)"
  preamble: |
    TASK RICORRENTI / TIMER / PROMEMORIA / SCHEDULAZIONE
    -> list_scheduled_tasks (lista), delete_tasks_scheduled (cancella), show_scheduled_task (dettaglio),
       schedule_recurring (crea), toggle_scheduled_task (abilita/disabilita), scheduled_task_history (storico),
       run_scheduled_task_now (esegui subito).
    Sono i task automatici di Metnos: cron-like (daily@HH:MM, every_Ns/m/h), persistiti in scheduler_v2.sqlite.
    Distinti da: eventi calendar (read_events), processi sistema (get_processes), undo (undo_last_turn).

rules:
  - name: list_tasks
    when: "richieste di vedere i task ricorrenti / timer / promemoria («che task ho schedulato», «lista timer», «quali task ricorrenti», «mostrami i promemoria», «lista task schedulati», «cosa Metnos fa automaticamente»)"
    must: "usa list_scheduled_tasks. Ritorna `tasks: [{id, name, schedule_human, last_fire_human, ...}]` + `summary` user-facing con ID espliciti per cancellazione successiva"
    must_not: "chiamare get_processes (processi sistema correnti, NON task Metnos) NE' read_events (eventi calendar, NON task ricorrenti)"
    ok: "«lista task ricorrenti» -> list_scheduled_tasks() -> final_answer con `summary` dell'observation"
    error: "«lista task ricorrenti» -> get_processes() (E' UN ERRORE: get_processes mostra PID/CPU dei processi OS, niente a che fare con i task ricorrenti Metnos)"

  - name: cancel_task
    when: "richieste di cancellare / fermare / rimuovere un task ricorrente / timer / promemoria («cancella timer ping», «ferma il task X», «rimuovi il promemoria delle mail», «stoppa il task ricorrente», «cancella il task riassunto_mail»)"
    must: "usa delete_tasks_scheduled(id=<numero>) se l'utente cita un ID, oppure delete_tasks_scheduled(name=<slug>) se cita il nome. Se l'utente e' vago («cancella il task delle mail»), chiama prima list_scheduled_tasks per mostrare gli ID e chiedi precisazione"
    must_not: "chiamare delete_events (cancella EVENTI CALENDAR, non task ricorrenti) NE' kill (processi OS)"
    ok: "«cancella timer 17» -> delete_tasks_scheduled(id=17) -> final_answer. OPPURE «cancella task riassunto_mail» -> delete_tasks_scheduled(name=\"riassunto_mail\") -> final_answer"
    error: "«cancella task ricorrente riassunto_mail» -> delete_events(...) (E' UN ERRORE: delete_events cancella eventi del calendario, non task ricorrenti Metnos. Il nome non e' un event_id)"

  - name: show_task_history
    when: "richieste di vedere storico/cronologia/ultime esecuzioni di un task ricorrente («storico esecuzioni task X», «cronologia del task ricorrente», «log fire del timer», «ultime esecuzioni del task»)"
    must: "usa scheduled_task_history(name=<slug>?, limit=<N>?). Senza name = storico di tutti i task. Ritorna lista di fire con timestamp/status/duration"
    must_not: "chiamare get_processes (processi correnti, non storico) NE' read_events (eventi calendar)"
    ok: "«storico esecuzioni del task ping» -> scheduled_task_history(name=\"ping\", limit=10) -> final_answer"
    error: "«storico esecuzioni del task ricorrente» -> get_processes() (E' UN ERRORE: get_processes mostra snapshot processi correnti, non storico task)"

  - name: schedule_task
    when: "richieste di SCHEDULARE / CREARE un task ricorrente / promemoria / timer («ogni giorno alle 9 X», «ogni N minuti Y», «ricorda di X», «schedula Y», «pianifica X tutti i giorni»)"
    must: "usa schedule_recurring(name=<slug>, schedule=<daily@HH:MM|every_Ns/m/h>, query=<frase utente naturale>, label=<descrizione>?). Lo scheduler v2 invochera' un nuovo turno con `query` a ogni fire"
    must_not: "creare un evento calendar con create_events (e' un task RICORRENTE, non un evento singolo)"
    ok: "«ogni giorno alle 9 leggi le mail» -> schedule_recurring(name=\"check_mail_mattutino\", schedule=\"daily@09:00\", query=\"leggi le ultime mail\") -> final_answer"
    error: "«ogni giorno alle 9 X» -> create_events (E' UN ERRORE: create_events crea UN evento, non un task che si ripete)"

  - name: toggle_task
    when: "richieste di metter in pausa / sospendere / riattivare un task senza cancellarlo («metti in pausa il task X», «sospendi temporaneamente», «riattiva il task ricorrente»)"
    must: "usa toggle_scheduled_task(name=<slug>, enabled=<true|false>). Disabilitato = non fire-a ma resta in DB; riabilitabile."
    must_not: "cancellare il task con delete_tasks_scheduled (irreversibile, usa solo per rimozione definitiva)"
    ok: "«sospendi il task ping» -> toggle_scheduled_task(name=\"ping\", enabled=false) -> final_answer"
    error: "«sospendi temporaneamente il task» -> delete_tasks_scheduled (E' UN ERRORE: la cancellazione e' permanente, la sospensione e' temporanea)"
