section:
  name: synt_tests
  header: "Stage 3 TESTS di synt-multistage"
  preamble: "Un solo oggetto JSON, senza prosa, markdown o commenti."
context:
  decisions_locked:
    name: "{{ name }}"
    args_required: "{{ args_required }}"
    args_properties_summary: "{{ args_properties_summary }}"
    capabilities: "{{ capabilities }}"
    revertible: "{{ revertible }}"
    reverse_pattern: "{{ reverse_pattern }}"
  user_request: "{{ user_request }}"
rules:
  - name: invocation_contract
    body: |
      I test invocano direttamente la funzione con argomenti concreti conformi
      allo schema dichiarato. Solo se è dichiarato from_step, sostituisci quel
      riferimento con entries contenente i record effettivi; nel test non esiste
      lo scratchpad. Non inventare nomi di argomenti o valori from_step. Per un
      elemento invalido in un batch best-effort verifica fail_count_eq ed
      error_contains; ok=false riguarda invocazioni invalide, come un numero
      al posto di una lista richiesta.
  - name: test_count
    body: "Produci 4-6 test, con nomi unici."
  - name: declarative_only
    body: |
      DEVI: usare solo name, input ed expect, con almeno un controllo in expect.
      NON DEVI: produrre setup, teardown, env, reference, comandi shell o dipendenze da rete, chiavi e dati dell'host.
      OK: {"name":"lista_vuota","input":{"entries":[]},"expect":{"ok":true,"ok_count_eq":0}}.
      ERRORE: un test che prepara o pulisce file mediante shell, anche con stringa vuota. E' UN ERRORE.
  - name: private_fixture
    body: "Ogni prova ha un ambiente privato nuovo, senza rete: fixture/input.txt contiene \"birth fixture\\\\n\", fixture/empty.txt è vuoto e fixture/output è una cartella vuota. Usa percorsi relativi a questo ambiente quando servono file; gli altri input sono dati concreti. Nessun file dell'host è disponibile."
  - name: mandatory_cases
    body: "Un elemento, lista vuota se pertinente, argomenti invalidi e un caso limite del dominio."
output_schema:
  type: object
  required: [tests]
  properties:
    tests:
      type: array
      minItems: 4
      maxItems: 6
      items:
        type: object
        additionalProperties: false
        required: [name, input, expect]
        properties:
          name: {type: string}
          input: {type: object}
          expect:
            type: object
            minProperties: 1
            additionalProperties: false
            properties:
              ok: {type: boolean}
              ok_count_eq: {type: integer}
              fail_count_eq: {type: integer}
              error_contains: {type: string}
examples:
  - name_for: change_texts
    note: "Esempio di sola forma: non copiare letteralmente nomi, input o aspettative."
    output:
      tests:
        - {"name":"un_elemento","input":{"entries":["Ab"]},"expect":{"ok":true,"ok_count_eq":1}}
        - {"name":"lista_vuota","input":{"entries":[]},"expect":{"ok":true,"ok_count_eq":0}}
        - {"name":"tipo_invalido","input":{"entries":42},"expect":{"ok":false,"error_contains":"list"}}
        - {"name":"testo_vuoto","input":{"entries":[""]},"expect":{"ok":true,"ok_count_eq":1}}
footer:
  instruction: "ORA produci il JSON per {{ name }}. SOLO JSON."
