[package]
name = "metnos-client"
version = "0.2.0"
edition = "2021"
description = "Metnos remote executor client (Rust)"
license = "AGPL-3.0-only"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
dirs = "5"
ed25519-dalek = { version = "2", features = ["rand_core", "pem"] }
rand = "0.8"
# MVP: trasporto HTTP dentro l'overlay Headscale (§6 design doc: TLS =
# fase successiva). Niente feature TLS => niente `ring` (C) => static-link
# musl PURO Rust, zero cross-gcc (ADR 0037). rustls torna con mTLS (W3+).
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"
panic = "abort"
