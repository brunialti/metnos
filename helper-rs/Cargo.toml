[package]
name = "metnos-helper"
version = "0.1.0"
edition = "2021"
description = "Metnos elevated helper for Windows package operations (ADR 0210)"
license = "AGPL-3.0-only"

# Dipendenze RIDOTTE AL MINIMO, e la riduzione e' la scelta di sicurezza piu'
# importante di questo progetto. L'aiutante e' il software piu' privilegiato
# che Metnos installi su una macchina altrui: tutto cio' che linka diventa
# superficie con privilegi di sistema.
#
# In particolare NON dipende da: un client HTTP, un runtime asincrono, un
# estrattore di archivi, il caricatore di executor. L'aiutante non parla con
# la rete e non esegue codice ricevuto: riceve TRE operazioni tipizzate da una
# pipe locale e costruisce da se' la riga di comando del gestore di pacchetti.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# La firma della richiesta si verifica qui, al momento di agire, invece di
# fidarsi della decisione ricevuta (ADR 0210 D3).
ed25519-dalek = "2"
sha2 = "0.10"
hex = "0.4"

[target.'cfg(windows)'.dependencies]
# Solo cio' che serve alla pipe con ACL e alla verifica del chiamante:
#   Win32_System_Pipes            → CreateNamedPipeW, ConnectNamedPipe
#   Win32_Security                → SID, ACL, SECURITY_ATTRIBUTES
#   Win32_Security_Authorization  → SetEntriesInAclW, ConvertStringSidToSidW
#   Win32_System_Threading        → OpenProcessToken, apertura del chiamante
#   Win32_Foundation              → handle, codici d'errore
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_IO",
    "Win32_System_Memory",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
