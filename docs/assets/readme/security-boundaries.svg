<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" role="img" aria-labelledby="sb-title sb-desc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif">
  <title id="sb-title">The six security boundaries around every tool a Metnos AI agent runs</title>
  <desc id="sb-desc">Six nested boundaries that a request crosses in order before a tool runs: a closed vocabulary, signed tools, plan validation, a guard for protected paths and destructive commands, your consent for sensitive steps, and a sandbox. At the centre the tool runs, its result is observed, and an undo arrow shows the declared inverse operation.</desc>
  <style>
    .card{fill:#FCFAF6;stroke:#E4DCCC}
    .ring{fill:#26221C;fill-opacity:.026}
    .box{fill:#FFFFFF;stroke:#CFC5B0}
    .t{fill:#26221C}.d{fill:#574F42}.m{fill:#8A8378}.w{fill:#FFFFFF}
    .arrow{stroke:#574F42;fill:none}.ah{fill:#574F42}
    .g{fill:#2E8B62}.b{fill:#4A6FB8}.o{fill:#C9671E}
    .gs{stroke:#2E8B62}.bs{stroke:#4A6FB8}.os{stroke:#C9671E}
    .gt{fill:#E4F1EA}
    .undo{stroke:#4A6FB8;fill:none}.uh{fill:#4A6FB8}
    @media (prefers-color-scheme: dark){
      .card{fill:#1E1A16;stroke:#3D352C}
      .ring{fill:#F0E9DD;fill-opacity:.04}
      .box{fill:#241F1A;stroke:#5A4F42}
      .t{fill:#F0E9DD}.d{fill:#CFC5B0}.m{fill:#9C9283}.w{fill:#1E1A16}
      .arrow{stroke:#CFC5B0}.ah{fill:#CFC5B0}
      .g{fill:#35A072}.b{fill:#5C8FE0}.o{fill:#D8762E}
      .gs{stroke:#35A072}.bs{stroke:#5C8FE0}.os{stroke:#D8762E}
      .gt{fill:#1F3329}
      .undo{stroke:#5C8FE0}.uh{fill:#5C8FE0}
    }
  </style>

  <rect class="card" x="0.5" y="0.5" width="879" height="479" rx="12"/>

  <text class="t" x="28" y="40" font-size="19" font-weight="700">Six boundaries between a sentence and an action</text>
  <text class="d" x="28" y="62" font-size="13.5">A request crosses them in order. Each one is enforced by code, not by a model's opinion.</text>

  <!-- nested boundaries, outermost first -->
  <g stroke-width="1.5">
    <rect class="ring bs" x="24"  y="80"  width="832" height="376" rx="12"/>
    <rect class="ring bs" x="42"  y="110" width="796" height="338" rx="11"/>
    <rect class="ring bs" x="60"  y="140" width="760" height="300" rx="10"/>
    <rect class="ring bs" x="78"  y="170" width="724" height="262" rx="9"/>
    <rect class="ring os" x="96"  y="200" width="688" height="224" rx="8"/>
    <rect class="ring bs" x="114" y="230" width="652" height="186" rx="7"/>
  </g>

  <!-- boundary labels -->
  <g font-size="12.5">
    <circle class="b" cx="42" cy="95" r="9"/>
    <text class="w" x="42" y="99" font-size="11" font-weight="700" text-anchor="middle">1</text>
    <text x="58" y="99.5"><tspan class="t" font-weight="700">Closed vocabulary</tspan><tspan class="d" dx="9">a plan can only name tools from the admitted catalog, never a free command</tspan></text>

    <circle class="b" cx="60" cy="125" r="9"/>
    <text class="w" x="60" y="129" font-size="11" font-weight="700" text-anchor="middle">2</text>
    <text x="76" y="129.5"><tspan class="t" font-weight="700">Signed tools</tspan><tspan class="d" dx="9">each tool's code, arguments and permissions are bound by a signature</tspan></text>

    <circle class="b" cx="78" cy="155" r="9"/>
    <text class="w" x="78" y="159" font-size="11" font-weight="700" text-anchor="middle">3</text>
    <text x="94" y="159.5"><tspan class="t" font-weight="700">Plan validation</tspan><tspan class="d" dx="9">names, types and links between steps are checked before anything runs</tspan></text>

    <circle class="b" cx="96" cy="185" r="9"/>
    <text class="w" x="96" y="189" font-size="11" font-weight="700" text-anchor="middle">4</text>
    <text x="112" y="189.5"><tspan class="t" font-weight="700">Guard</tspan><tspan class="d" dx="9">protected paths and destructive commands are refused</tspan></text>

    <circle class="o" cx="114" cy="215" r="9"/>
    <text class="w" x="114" y="219" font-size="11" font-weight="700" text-anchor="middle">5</text>
    <text x="130" y="219.5"><tspan class="t" font-weight="700">Your consent</tspan><tspan class="d" dx="9">sensitive steps wait for your yes, tied to you and to that one request</tspan></text>

    <circle class="b" cx="132" cy="245" r="9"/>
    <text class="w" x="132" y="249" font-size="11" font-weight="700" text-anchor="middle">6</text>
    <text x="148" y="249.5"><tspan class="t" font-weight="700">Sandbox</tspan><tspan class="d" dx="9">an isolated process: no network, no personal files beyond what its contract declares</tspan></text>
  </g>

  <!-- the request crossing every boundary -->
  <line class="arrow" x1="8" y1="324" x2="252" y2="324" stroke-width="2"/>
  <path class="ah" d="M262 324 l-11 -5.5 v11 z"/>
  <g>
    <circle class="b" cx="24" cy="324" r="4"/>
    <circle class="b" cx="42" cy="324" r="4"/>
    <circle class="b" cx="60" cy="324" r="4"/>
    <circle class="b" cx="78" cy="324" r="4"/>
    <circle class="o" cx="96" cy="324" r="4"/>
    <circle class="b" cx="114" cy="324" r="4"/>
  </g>
  <text class="d" x="134" y="314" font-size="12.5">your request</text>

  <!-- centre: the tool, its result, undo -->
  <rect class="gt gs" x="264" y="286" width="208" height="76" rx="8" stroke-width="1.5"/>
  <text class="t" x="368" y="319" font-size="14.5" font-weight="700" text-anchor="middle">The tool runs</text>
  <text class="d" x="368" y="340" font-size="12.5" text-anchor="middle">one small, declared job</text>

  <line class="arrow" x1="472" y1="324" x2="520" y2="324" stroke-width="2"/>
  <path class="ah" d="M530 324 l-11 -5.5 v11 z"/>

  <rect class="box" x="532" y="286" width="208" height="76" rx="8" stroke-width="1.5"/>
  <text class="t" x="636" y="319" font-size="14.5" font-weight="700" text-anchor="middle">The result is observed</text>
  <text class="d" x="636" y="340" font-size="12.5" text-anchor="middle">and reported as it is</text>

  <path class="undo" d="M636 362 C636 392 368 392 368 373" stroke-width="1.8" stroke-dasharray="5 4"/>
  <path class="uh" d="M368 363 l-5.5 11 h11 z"/>
  <text class="d" x="502" y="405" font-size="12.5" text-anchor="middle">Undo: a declared inverse operation, for the tools that have one</text>
</svg>
