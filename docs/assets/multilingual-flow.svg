<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">The multilingual path of a Metnos request</title>
<desc id="desc">The configured instance language enters the shared execution context. The context coordinates prompts, executor manifests, deterministic messages, and the detection lexicon. Every user and channel in the instance uses the same language. A separate path shows compilation and signing of the Tutor catalog.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#765236"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#5E7651"/></marker></defs>
<rect width="1200" height="720" rx="22" fill="#FCFAF6"/>
<text x="600" y="42" text-anchor="middle" font-family="Georgia,serif" font-size="27" font-weight="700" fill="#493626">The multilingual path of a Metnos request</text>
<text x="600" y="70" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#6C5C4B">The instance language follows every turn; release content remains verifiable and separate.</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<g><circle cx="90" cy="135" r="27" fill="#9A5B2D"/><text x="90" y="144" font-size="22" font-weight="700" fill="#FFF8EB">1</text><rect x="28" y="178" width="124" height="92" rx="14" fill="#F6E6CE" stroke="#9A5B2D" stroke-width="2"/><text x="90" y="205" font-size="15" font-weight="700" fill="#6F4122">Metnos instance</text><text x="90" y="228" font-size="12" fill="#574F42">configured language</text><text x="90" y="247" font-size="12" fill="#574F42">users + channels</text></g>
<g><circle cx="270" cy="135" r="27" fill="#9A5B2D"/><text x="270" y="144" font-size="22" font-weight="700" fill="#FFF8EB">2</text><rect x="195" y="178" width="150" height="92" rx="14" fill="#F7F0E5" stroke="#765236" stroke-width="2"/><text x="270" y="205" font-size="15" font-weight="700" fill="#493626">Turn context</text><text x="270" y="228" font-size="12" fill="#574F42">normalised tag</text><text x="270" y="247" font-size="12" fill="#574F42">isolated by ContextVar</text></g>
<g><circle cx="490" cy="135" r="27" fill="#9A5B2D"/><text x="490" y="144" font-size="22" font-weight="700" fill="#FFF8EB">3</text><rect x="395" y="178" width="190" height="92" rx="14" fill="#E7EDE2" stroke="#5E7651" stroke-width="2"/><text x="490" y="203" font-size="15" font-weight="700" fill="#39552F">Coordinated sources</text><text x="490" y="225" font-size="12" fill="#574F42">prompts · manifests</text><text x="490" y="244" font-size="12" fill="#574F42">messages · detection</text></g>
<g><circle cx="730" cy="135" r="27" fill="#9A5B2D"/><text x="730" y="144" font-size="22" font-weight="700" fill="#FFF8EB">4</text><rect x="625" y="178" width="210" height="92" rx="14" fill="#F7F0E5" stroke="#765236" stroke-width="2"/><text x="730" y="203" font-size="15" font-weight="700" fill="#493626">Plan and execution</text><text x="730" y="225" font-size="12" fill="#574F42">intent → executor</text><text x="730" y="244" font-size="12" fill="#574F42">same contract and authority</text></g>
<g><circle cx="1010" cy="135" r="27" fill="#9A5B2D"/><text x="1010" y="144" font-size="22" font-weight="700" fill="#FFF8EB">5</text><rect x="900" y="178" width="220" height="92" rx="14" fill="#E7EDE2" stroke="#5E7651" stroke-width="2"/><text x="1010" y="203" font-size="15" font-weight="700" fill="#39552F">Rendered response</text><text x="1010" y="225" font-size="12" fill="#574F42">instance → English → missing</text><text x="1010" y="244" font-size="12" fill="#574F42">chat · alerts · devices</text></g></g>
<g stroke="#765236" stroke-width="3" fill="none" marker-end="url(#a)"><line x1="152" y1="224" x2="190" y2="224"/><line x1="345" y1="224" x2="390" y2="224"/><line x1="585" y1="224" x2="620" y2="224"/><line x1="835" y1="224" x2="895" y2="224"/></g>
<text x="600" y="307" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#6C5C4B">Language changes understanding and rendering; it does not change permissions, ownership, or executor authority.</text>
<rect x="85" y="358" width="1030" height="236" rx="18" fill="#F7F0E5" stroke="#CBB99E" stroke-width="2"/>
<text x="110" y="394" font-family="Georgia,serif" font-size="21" font-weight="700" fill="#493626">Release path: why the sources are trustworthy</text>
<g font-family="Arial,sans-serif"><g text-anchor="middle"><rect x="115" y="425" width="205" height="86" rx="12" fill="#FFF8EB" stroke="#765236" stroke-width="2"/><text x="217" y="452" font-size="14" font-weight="700" fill="#493626">Public sources</text><text x="217" y="475" font-size="12" fill="#574F42">language-specific docs</text><text x="217" y="493" font-size="12" fill="#574F42">admitted manifests</text><rect x="385" y="425" width="205" height="86" rx="12" fill="#FFF8EB" stroke="#765236" stroke-width="2"/><text x="487" y="452" font-size="14" font-weight="700" fill="#493626">Tutor compilation</text><text x="487" y="475" font-size="12" fill="#574F42">units by language</text><text x="487" y="493" font-size="12" fill="#574F42">source fingerprints</text><rect x="655" y="425" width="205" height="86" rx="12" fill="#E7EDE2" stroke="#5E7651" stroke-width="2"/><text x="757" y="452" font-size="14" font-weight="700" fill="#39552F">Signed catalog</text><text x="757" y="475" font-size="12" fill="#574F42">SQLite + signature</text><text x="757" y="493" font-size="12" fill="#574F42">consistent snapshot</text><rect x="925" y="425" width="155" height="86" rx="12" fill="#F6E6CE" stroke="#9A5B2D" stroke-width="2"/><text x="1002" y="452" font-size="14" font-weight="700" fill="#6F4122">Verification</text><text x="1002" y="475" font-size="12" fill="#574F42">coverage</text><text x="1002" y="493" font-size="12" fill="#574F42">+ review</text></g></g>
<g stroke="#5E7651" stroke-width="3" fill="none" marker-end="url(#g)"><line x1="320" y1="468" x2="380" y2="468"/><line x1="590" y1="468" x2="650" y2="468"/><line x1="860" y1="468" x2="920" y2="468"/></g>
<text x="600" y="558" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#6C5C4B">The Tutor catalog provides public knowledge; the i18n catalog provides deterministic messages.</text>
<text x="600" y="684" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#8A8378">Metnos editorial diagram · request path above, release path below</text>
</svg>
