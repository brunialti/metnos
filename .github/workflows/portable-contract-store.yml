name: Portable contract-store certification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-contract-store:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2022

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          check-latest: false

      - name: Confirm that the Windows workspace is on NTFS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $workspace = (Resolve-Path $env:GITHUB_WORKSPACE).Path
          $root = [System.IO.Path]::GetPathRoot($workspace)
          $drive = [System.IO.DriveInfo]::new($root)
          if ($drive.DriveFormat -ne "NTFS") {
            throw "Portable contract-store tests require NTFS; found $($drive.DriveFormat)."
          }

      - name: Install the minimal test dependencies
        run: python -m pip install --disable-pip-version-check --requirement tests/portable/requirements.txt

      - name: Run the portable certification suite
        run: python -m pytest -q -p no:cacheprovider --confcutdir=tests/portable tests/portable
