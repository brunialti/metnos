name: Portable contract-store certification

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      rm0008_snapshot_pre_fix:
        description: Record the frozen RM-0008 2A pre-fix outcomes
        required: true
        default: false
        type: boolean
      rm0008_run_diagnostic:
        description: Run the historical RM-0008 D diagnostic explicitly
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  RM0008_A_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.rm0008_snapshot_pre_fix && 'snapshot' || 'final' }}

jobs:
  portable-contract-store:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # The Linux job also runs the real systemd cell, whose gate censuses every
    # unit on the machine on each start; fifteen minutes was chosen before
    # that cell existed and would kill it mid-verdict.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2022

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          check-latest: false

      - name: Confirm that the Windows workspace is on NTFS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $workspace = (Resolve-Path $env:GITHUB_WORKSPACE).Path
          $root = [System.IO.Path]::GetPathRoot($workspace)
          $drive = [System.IO.DriveInfo]::new($root)
          if ($drive.DriveFormat -ne "NTFS") {
            throw "Portable contract-store tests require NTFS; found $($drive.DriveFormat)."
          }

      - name: Install the minimal test dependencies
        run: python -m pip install --disable-pip-version-check --requirement tests/portable/requirements.txt

      - name: Install the Linux sandbox backend
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y bubblewrap

      - name: Calibrate real identities and the independent ACL oracle
        if: runner.os == 'Windows'
        env:
          PYTHONPATH: tests/windows_identity
        run: >-
          python -m pytest -q -p no:cacheprovider --strict-markers --maxfail=1
          --import-mode=importlib
          --confcutdir=tests/windows_identity
          tests/windows_identity/test_windows_real_identity_oracle.py

      - name: Run the portable certification suite
        run: >-
          python -m pytest -q -p no:cacheprovider --import-mode=importlib
          --confcutdir=tests/portable
          --ignore=tests/portable/rm0008_2a_acceptance
          tests/portable

      - name: Certify the real delegated Linux Birth runner
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo systemd-run --quiet --wait --pipe --collect \
            --unit="metnos-birth-cert-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --property=Type=exec \
            --property="Delegate=memory pids" \
            --property=DelegateSubgroup=metnos-birth-host \
            --property=MemoryAccounting=yes \
            --property=MemoryMax=1G \
            --property=TasksAccounting=yes \
            --property=TasksMax=256 \
            --working-directory="$GITHUB_WORKSPACE" \
            --setenv="PATH=$PATH" \
            --setenv=PYTHONPATH=runtime \
            --setenv=METNOS_REQUIRE_REAL_BIRTH_LINUX=1 \
            "${pythonLocation}/bin/python" -m pytest -q -p no:cacheprovider \
            --import-mode=importlib \
            --confcutdir=tests/portable \
            tests/portable/test_executor_birth_runner_linux_real.py

      - name: Run the historical RM-0008 D diagnostic explicitly
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch' && inputs.rm0008_run_diagnostic
        env:
          PYTHONPATH: tests/windows_identity
        run: python tests/windows_identity/rm0008_increment_2a_windows_diagnostics.py

  rm0008-a-manifest:
    name: RM-0008 2A / manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          check-latest: false
      - name: Install the minimal test dependencies
        run: python -m pip install --disable-pip-version-check --requirement tests/portable/requirements.txt
      - name: Run the owned manifest cells
        run: >-
          python -P tests/portable/rm0008_2a_acceptance/run_activity_v1.py
          --activity manifest --mode "$RM0008_A_MODE" --import-mode=importlib
          --evidence rm0008-2a-evidence-manifest.json
      - name: Upload canonical evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rm0008-2a-evidence-manifest
          path: rm0008-2a-evidence-manifest.json
          if-no-files-found: error

  rm0008-a-portable-ubuntu:
    name: RM-0008 2A / portable Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          check-latest: false
      - name: Install the minimal test dependencies
        run: python -m pip install --disable-pip-version-check --requirement tests/portable/requirements.txt
      - name: Run the owned portable Ubuntu cells
        run: >-
          python -P tests/portable/rm0008_2a_acceptance/run_activity_v1.py
          --activity portable-ubuntu --mode "$RM0008_A_MODE" --import-mode=importlib
          --evidence rm0008-2a-evidence-portable-ubuntu.json
      - name: Upload canonical evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rm0008-2a-evidence-portable-ubuntu
          path: rm0008-2a-evidence-portable-ubuntu.json
          if-no-files-found: error

  rm0008-a-portable-windows:
    name: RM-0008 2A / portable Windows
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          check-latest: false
      - name: Install the minimal test dependencies
        run: python -m pip install --disable-pip-version-check --requirement tests/portable/requirements.txt
      - name: Run the owned portable Windows cells
        run: >-
          python -P tests/portable/rm0008_2a_acceptance/run_activity_v1.py
          --activity portable-windows --mode "$env:RM0008_A_MODE" --import-mode=importlib
          --evidence rm0008-2a-evidence-portable-windows.json
      - name: Upload canonical evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rm0008-2a-evidence-portable-windows
          path: rm0008-2a-evidence-portable-windows.json
          if-no-files-found: error

  rm0008-a-concurrency-ubuntu:
    name: RM-0008 2A / concurrency Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          check-latest: false
      - name: Install the minimal test dependencies
        run: python -m pip install --disable-pip-version-check --requirement tests/portable/requirements.txt
      - name: Run the owned concurrency Ubuntu cells
        run: >-
          python -P tests/portable/rm0008_2a_acceptance/run_activity_v1.py
          --activity concurrency-ubuntu --mode "$RM0008_A_MODE" --import-mode=importlib
          --evidence rm0008-2a-evidence-concurrency-ubuntu.json
      - name: Upload canonical evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rm0008-2a-evidence-concurrency-ubuntu
          path: rm0008-2a-evidence-concurrency-ubuntu.json
          if-no-files-found: error

  rm0008-a-concurrency-windows:
    name: RM-0008 2A / concurrency Windows
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          check-latest: false
      - name: Install the minimal test dependencies
        run: python -m pip install --disable-pip-version-check --requirement tests/portable/requirements.txt
      - name: Run the owned concurrency Windows cells
        run: >-
          python -P tests/portable/rm0008_2a_acceptance/run_activity_v1.py
          --activity concurrency-windows --mode "$env:RM0008_A_MODE" --import-mode=importlib
          --evidence rm0008-2a-evidence-concurrency-windows.json
      - name: Upload canonical evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rm0008-2a-evidence-concurrency-windows
          path: rm0008-2a-evidence-concurrency-windows.json
          if-no-files-found: error

  rm0008-a-windows-acl:
    name: RM-0008 2A / Windows ACL real identities
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          check-latest: false
      - name: Install the minimal test dependencies
        run: python -m pip install --disable-pip-version-check --requirement tests/portable/requirements.txt
      - name: Run the owned Windows ACL cells
        env:
          PYTHONPATH: tests/windows_identity
        run: >-
          python -P tests/portable/rm0008_2a_acceptance/run_activity_v1.py
          --activity windows-acl --mode "$env:RM0008_A_MODE" --import-mode=importlib
          --evidence rm0008-2a-evidence-windows-acl.json
      - name: Upload canonical evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rm0008-2a-evidence-windows-acl
          path: rm0008-2a-evidence-windows-acl.json
          if-no-files-found: error

  rm0008-a-summary:
    name: RM-0008 2A / certification summary
    if: always()
    needs:
      - portable-contract-store
      - rm0008-a-manifest
      - rm0008-a-portable-ubuntu
      - rm0008-a-portable-windows
      - rm0008-a-concurrency-ubuntu
      - rm0008-a-concurrency-windows
      - rm0008-a-windows-acl
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require every blocking dependency to succeed
        env:
          HISTORICAL: ${{ needs.portable-contract-store.result }}
          MANIFEST: ${{ needs.rm0008-a-manifest.result }}
          PORTABLE_UBUNTU: ${{ needs.rm0008-a-portable-ubuntu.result }}
          PORTABLE_WINDOWS: ${{ needs.rm0008-a-portable-windows.result }}
          CONCURRENCY_UBUNTU: ${{ needs.rm0008-a-concurrency-ubuntu.result }}
          CONCURRENCY_WINDOWS: ${{ needs.rm0008-a-concurrency-windows.result }}
          WINDOWS_ACL: ${{ needs.rm0008-a-windows-acl.result }}
        shell: bash
        run: |
          for result in "$HISTORICAL" "$MANIFEST" "$PORTABLE_UBUNTU" "$PORTABLE_WINDOWS" "$CONCURRENCY_UBUNTU" "$CONCURRENCY_WINDOWS" "$WINDOWS_ACL"; do
            test "$result" = success
          done
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          check-latest: false
      - name: Download all six evidence documents
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: rm0008-2a-evidence-*
          path: rm0008-2a-evidence
          merge-multiple: true
      - name: Validate the final evidence or aggregate the manual snapshot
        shell: bash
        run: |
          if [[ "$RM0008_A_MODE" = snapshot ]]; then
            python -P tests/portable/rm0008_2a_acceptance/aggregate_evidence_v1.py --mode snapshot --evidence-dir rm0008-2a-evidence --output tests/portable/rm0008-2a-pre-fix-evidence-v1.json
          else
            python -P tests/portable/rm0008_2a_acceptance/aggregate_evidence_v1.py --mode final --evidence-dir rm0008-2a-evidence
          fi
      - name: Upload the manual pre-fix snapshot
        if: github.event_name == 'workflow_dispatch' && inputs.rm0008_snapshot_pre_fix
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rm0008-2a-pre-fix-evidence-v1
          path: tests/portable/rm0008-2a-pre-fix-evidence-v1.json
          if-no-files-found: error
