manifest_format = "1.0"
executor_standard = "metnos.executor/1.0"

name         = "run_processes"
version      = "0.4.0"
intelligence = "deterministic"
timeout_s    = 30
platforms    = ["windows"]
author       = "Roberto Brunialti"
affinity     = [
  "avvia", "avviare", "lancia", "lanciare", "fai partire",
  "esegui programma", "start", "launch", "run program", "start program"
]
revertible = true
reverse_pattern = "module.reverse"
critical   = true
lifecycle  = "active"

[execution]
effect            = "mutating"
parallelism_class = 0
resource_class    = "device"
concurrency_key   = "device"
equivalence_gate  = "unverified"

[description]
it = "SCOPO: avvia software installato con ricevuta dei processi creati. PATTERN: find_packages(...) -> run_processes(from_step=1). NON: sessioni web (-> open_sites), path, comandi, script o id non registrati. OUT: chiede sessione o persistenza, poi restituisce results e failed."
en = "SCOPO: runs installed software with receipts for created processes. PATTERN: find_packages(...) -> run_processes(from_step=1). NON: web sessions (-> open_sites), paths, commands, scripts, or unregistered ids. OUT: asks for session or persistence, then returns results and failed."

[code]
files  = ["run_processes.py"]
digest = "sha256:1537a8926171da6912622c48f18ddac26ea420f06c54b1da8abf35902af775f5"

[args]
type     = "object"
required = ["programs"]
from_step_alternatives = ["programs"]

[args.properties.from_step]
type = "integer"
minimum = 1

[args.properties.from_step.description]
it = "Passo find_packages che ha risolto tutti i nomi in identificativi esatti. Preferiscilo per richieste in linguaggio naturale."
en = "The find_packages step that resolved every name to an exact identifier. Prefer it for natural-language requests."

[args.properties.programs]
type        = "array"
uniqueItems = true
minItems    = 1
maxItems    = 10
from_entries_key = "resolved_id"
from_entries_complete = true
items       = { type = "string", maxLength = 128 }

[args.properties.programs.description]
it = "Identificativi esatti dei pacchetti installati, come lista. Non accetta percorsi, comandi, caratteri jolly o nomi da indovinare."
en = "Exact identifiers of installed packages, as a list. Paths, commands, wildcards, and names that require guessing are not accepted."

[args.properties.lifetime]
type             = "string"
enum             = ["session", "persistent"]
runtime_resolved = true

[args.properties.lifetime.description]
it = "Scelta inserita dal runtime dopo il consenso: 'session' fino al riavvio, 'persistent' anche alle accensioni successive."
en = "Choice inserted by the runtime after consent: 'session' until restart, 'persistent' also at subsequent startups."

[args.properties.actor_consent_token]
type             = "string"
runtime_resolved = true

[args.properties.actor_consent_token.description]
it = "Token della scheda approvata, inserito dal runtime. Il planner non lo vede e non lo genera."
en = "Token for the approved card, inserted by the runtime. The planner neither sees nor generates it."

[output]
schema_inline = """
{
  ok: bool,
  decision?: str,
  started?: bool,
  lifetime?: str,
  needs_inputs?: object,
  results: Array<{package_id: str, ok: bool, lifetime: str, already_running: bool}>,
  failed: Array<{package_id?: str, error: str, error_code: str, error_class: str}>,
  ok_count: int,
  fail_count: int,
  partial?: bool,
  _undo: {outcome: str, processes?: Array<{package_id: str, pid: int, creation_time: int}>},
  error?: str,
  error_code?: str,
  error_class?: str
}
"""

[undo]
outcome = "per_execution"

[planning]
# Relazione firmata e generica: prima di avviare, rende disponibile il
# resolver del dominio software. Il motore non contiene nomi di executor.
companions = ["find_packages"]
# Il nome pubblico descrive il processo prodotto; l'identita' consumata
# appartiene al dominio canonico del software installato.
object_aliases = ["packages"]

[[capabilities]]
name = "system:admin"
hint = ["managed-package-start"]

[[capabilities]]
name = "code:exec"
hint = ["registered-package"]

[placement]
scope       = "any"
device_ok   = true
min_sandbox = "job-object"

[[tests]]
name   = "missing_programs_fails"
input  = {}
expect = { ok = false, field_eq = { error_code = "programs_missing" } }

[[tests]]
name   = "free_path_is_rejected"
input  = { programs = ["C:\\Windows\\System32\\cmd.exe"] }
expect = { ok = false, field_eq = { error_code = "invalid_package_id" } }

[[tests]]
name   = "duplicate_package_is_rejected"
input  = { programs = ["Vendor.App", "Vendor.App"] }
expect = { ok = false, field_eq = { error_code = "duplicate_package" } }
