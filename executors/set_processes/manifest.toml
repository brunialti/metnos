manifest_format = "1.0"
executor_standard = "metnos.executor/1.0"
name = "set_processes"
version = "0.1.0"
intelligence = "deterministic"
timeout_s = 180
platforms = ["windows"]
author = "Metnos maintainers"
affinity = ["chiudi programma", "chiudi applicazione", "chiudi", "termina programma", "arresta programma", "close application", "close program", "quit application", "stop program"]
revertible = false
critical = true
lifecycle = "active"

[execution]
effect = "mutating"
parallelism_class = 0
resource_class = "device"
concurrency_key = "device"
equivalence_gate = "unverified"

[description]
it = "SCOPO: chiude applicazioni desktop Windows registrate. PATTERN: find_packages(...) -> set_processes(from_step=1). NON: preferenze, sessioni web, servizi o comandi liberi. OUT: chiede chiusura normale o forzata; results conferma soltanto processi terminati, failed indica quelli ancora attivi."
en = "SCOPO: closes registered Windows desktop applications. PATTERN: find_packages(...) -> set_processes(from_step=1). NON: preferences, web sessions, services, or free commands. OUT: asks for normal or forced closure; results confirms only terminated processes, failed identifies those still running."

[code]
files = ["set_processes.py"]
digest = "sha256:176ddaa99b698a401c894fd044784d820b9786b610db452726fbbfcedd8bb551"

[args]
type = "object"
required = ["programs"]
from_step_alternatives = ["programs"]

[args.properties.from_step]
type = "integer"
minimum = 1
[args.properties.from_step.description]
it = "Passo find_packages che ha risolto i nomi in identificativi esatti."
en = "The find_packages step that resolved names into exact identifiers."

[args.properties.programs]
type = "array"
uniqueItems = true
maxItems = 10
from_entries_key = "resolved_id"
from_entries_complete = true
from_entries_candidates_key = "candidates"
items = {type = "string", maxLength = 72}
[args.properties.programs.description]
it = "Identificativi desktop esatti delle applicazioni registrate. Non accetta nomi, percorsi, comandi o caratteri jolly."
en = "Exact desktop identifiers of registered applications. Names, paths, commands, and wildcards are not accepted."

[args.properties.state]
type = "string"
enum = ["closed"]
default = "closed"
[args.properties.state.description]
it = "Stato richiesto: closed significa applicazione terminata."
en = "Requested state: closed means the application has exited."

[args.properties.close_mode]
type = "string"
enum = ["graceful", "force"]
runtime_resolved = true
[args.properties.close_mode.description]
it = "Scelta umana inserita dal runtime: normale o forzata."
en = "Human choice inserted by the runtime: normal or forced."

[args.properties.process_targets]
type = "object"
runtime_resolved = true
[args.properties.process_targets.description]
it = "Identità esatte dei processi osservati, legate al consenso."
en = "Exact observed process identities bound to consent."

[args.properties.actor_consent_token]
type = "string"
maxLength = 64
runtime_resolved = true
[args.properties.actor_consent_token.description]
it = "Consenso inserito dal runtime, non dal planner."
en = "Consent inserted by the runtime, not by the planner."

[output]
schema_inline = "{ok: bool, decision?: str, needs_inputs?: object, results: Array<object>, failed: Array<object>, ok_count: int, fail_count: int, partial?: bool, final_message_hint?: str, error?: str, error_code?: str}"

[planning]
companions = ["find_packages"]
object_aliases = ["packages"]

[[capabilities]]
name = "system:admin"
hint = ["registered-package-state"]
[[capabilities]]
name = "code:exec"
hint = ["registered-package"]

[placement]
scope = "any"
device_ok = true
min_sandbox = "job-object"

[[tests]]
name = "empty_list_has_no_effect"
input = {programs = []}
expect = {ok = true, field_eq = {ok_count = 0}}
[[tests]]
name = "missing_programs_rejected"
input = {}
expect = {ok = false}
[[tests]]
name = "free_path_rejected"
input = {programs = ["C:\\Windows\\System32\\cmd.exe"]}
expect = {ok = false}
[[tests]]
name = "wildcard_rejected"
input = {programs = ["*"]}
expect = {ok = false}
