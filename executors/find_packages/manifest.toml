# Manifest synthesized — Metnos synt multistage 2026-04-30
# Riscritto 17/8/2026 (ADR 0209, parte B): la domanda e' «e' installato»,
# non «c'e' un eseguibile con questo nome nel PATH».

manifest_format = "1.0"
executor_standard = "metnos.executor/1.0"

name        = "find_packages"
version     = "0.3.0"
platforms   = ["linux", "windows"]
author      = "synt-multistage <synt@metnos.com>"
affinity    = ["installato", "installed", "e' installato", "is installed",
               "programma", "program", "applicazione", "application",
               "pacchetto", "package", "software", "versione", "version",
               "ho installato", "do i have"]
revertible  = false
lifecycle   = "active"

[description]
it = "SCOPO: dice se dei programmi sono installati qui, e in che versione. PATTERN: find_packages(packages=['7zip.7zip','git']). NON: installare o togliere (-> install_packages); cercare file (-> find_files); eseguire comandi (-> admin). OUT: entries=[{package_id,installed,name,version,source}], una riga per ogni pacchetto chiesto, anche quelli assenti."
en = "SCOPO: tells whether programs are installed here, and at which version. PATTERN: find_packages(packages=['7zip.7zip','git']). NON: installing or removing (-> install_packages); finding files (-> find_files); running commands (-> admin). OUT: entries=[{package_id,installed,name,version,source}], one row per requested package, absent ones included."

[code]
files  = ["find_packages.py"]
digest = "sha256:19b5cc37457e5c9d821b3e7cef4485844b5b99cc4e841c23d00dd2e106b9bb1d"

[args]
type     = "object"
required = ["packages"]

[args.properties.packages]
type = "array"
uniqueItems = true
items = { type = "string", maxLength = 128 }

[args.properties.packages.description]
it = "Programmi da controllare, come lista. Va bene il nome comune ('outlook', 'git') oppure l'identificativo esatto ('Microsoft.VisualStudioCode', 'python3-pip'): si prova prima l'identificativo, poi il nome. NON servono '*' o '?': la ricerca per nome li fa gia'. Un solo elemento va bene."
en = "Programs to check, as a list. A common name ('outlook', 'git') works, and so does an exact identifier ('Microsoft.VisualStudioCode', 'python3-pip'): the identifier is tried first, the name second. No '*' or '?' needed: the name search already covers them. A single element is fine."

[output]
schema_inline = """
{
  ok: bool,
  entries: Array<{package_id: str, installed: bool, match: str, name: str,
                  version: str, source: str, resolved_id?: str,
                  also_matched?: Array<str>, path?: str}>,
  failed: Array<{package_id?: str, error: str, error_class: str, error_code: str}>,
  ok_count: int,
  fail_count: int,
  partial?: bool,
  source_primary: str,
  truncated?: bool,
  truncated_what?: str,
  used?: int,
  available_total?: int,
  cap_field?: str,
  cap_value?: int,
  error?: str,
  error_class?: str,
  error_code?: str
}
"""

[presentation]
default_view = "list"

[presentation.list]
mode = "table"
columns = [
  { key = "package_id", source = "package_id", cell_max = 120 },
  { key = "installed", source = "installed", cell_max = 12 },
  { key = "version", source = "version", cell_max = 60 },
  { key = "source", source = "source", cell_max = 24 },
]
max_rows = 200
max_chars = 16000
overflow = "notice"

[[capabilities]]
name = "system:read"
hint = ["installed_software", "package_database"]

# Interrogare il gestore dei pacchetti VUOL DIRE eseguire un programma: e' il
# meccanismo, non il privilegio. Dichiararlo e' la stessa scelta gia' fatta da
# `get_processes` (ps/tasklist). Conseguenza nota e accettata: su Windows il
# client declassa da AppContainer a job-object, perche' il token ristretto
# nega a winget l'accesso che gli serve — declassamento dichiarato nel result.
[[capabilities]]
name = "code:exec"
hint = ["winget", "dpkg-query", "rpm", "pacman"]

[placement]
# Read-only: nessuna modifica alla macchina. Il device SOLO se la chat lo
# nomina — «e' installato X sul mio PC» va interrogato su QUEL PC, non qui.
scope    = "any"
device_ok = true
min_sandbox = "job-object"

[[tests]]
name   = "un_pacchetto_di_sistema_risulta_installato"
input  = { packages = ["bash"] }
expect = { ok = true, metadata_field_eq = { ok_count = 1, fail_count = 0 } }

[[tests]]
name   = "un_pacchetto_assente_non_e_un_errore"
input  = { packages = ["metnos-package-that-does-not-exist-7f09"] }
expect = { ok = true, metadata_field_eq = { ok_count = 1, fail_count = 0 } }

[[tests]]
name   = "lista_vuota_e_un_errore_di_argomento"
input  = { packages = [] }
expect = { ok = false, error_contains = "packages" }

[[tests]]
name   = "un_identificativo_malformato_non_affonda_gli_altri"
input  = { packages = ["bash", "../etc/passwd"] }
expect = { ok = false, metadata_field_eq = { ok_count = 1, fail_count = 1 } }
