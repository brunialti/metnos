# Manifest dell'executor `read_pulls` — Metnos v1.1
# RM-0011 F1: il fornitore e' un ARGOMENTO, non un suffisso nel nome.

manifest_format = "1.0"
executor_standard = "metnos.executor/1.0"

name        = "read_pulls"
version     = "0.1.0"
timeout_s   = 60
platforms   = ["linux"]
author      = "Roberto Brunialti"
affinity    = [
    "leggi pull request", "dettaglio pull request", "differenza del codice", "diff della pull request", "read pull request", "contenuto pull", "modifiche proposte"
]
revertible      = false

[execution]
effect            = "read_only"
parallelism_class = 0
resource_class    = "network_io"
concurrency_key   = "none"

[description]
it = "SCOPO: legge una proposta di modifica per numero, con la differenza se richiesta. PATTERN: read_pulls(repo=\"owner/name\", number=7, include_diff=true). NON: cercarle per stato (-> find_pulls); unirla (-> change_pulls). OUT: entries=[{number,title,diff,repo}]."
en = "SCOPO: read one pull request by number, with the diff when requested. PATTERN: read_pulls(repo=\"owner/name\", number=7, include_diff=true). NON: search by state (-> find_pulls); merge it (-> change_pulls). OUT: entries=[{number,title,diff,repo}]."

[code]
files  = ["read_pulls.py"]

[output]
schema_inline = "{ok: bool, entries: Array<object>, used: int, available_total?: int, truncated?: bool, truncated_intentional?: bool, truncated_what?: str, source?: str, error_class?: str, error_code?: str, error?: str}"

[args]
type     = "object"
required = ["repo", "number"]

[args.properties.repo]
type        = "string"

[args.properties.repo.description]
it = "Repository in forma \"proprietario/nome\". Esempio: \"brunialti/metnos\"."
en = "Repository as \"owner/name\". Example: \"brunialti/metnos\"."

[args.properties.number]
type        = "integer"

[args.properties.number.description]
it = "Numero dell'elemento nel repository. Esempio: 42."
en = "Item number inside the repository. Example: 42."

[args.properties.include_diff]
type        = "boolean"

[args.properties.include_diff.description]
it = "Se vero, include la differenza del codice. Default falso."
en = "If true, include the code diff. Default false."

[args.properties.top_k]
type        = "integer"

[args.properties.top_k.description]
it = "Massimo di elementi restituiti. 0 = nessun limite. Default 100."
en = "Maximum items returned. 0 = no limit. Default 100."

[args.properties.client]
type        = "string"
enum        = ["github"]
default     = "github"

[args.properties.client.description]
it = "Implementazione backend. Oggi solo 'github'. Il runtime lo sceglie: non va indicato nella richiesta."
en = "Backend implementation. Today only 'github'. The runtime picks it: it is not stated in the request."

[[capabilities]]
# L'autorita' e' legata al VALORE dell'argomento, non al nome dello
# strumento (ADR 0193): rete e credenziali valgono solo per il
# provider effettivamente scelto.
name = "provider:access"
hint = ["github"]
when = { arg = "client", values = ["github"] }

# Prove di nascita: solo cio' che si verifica SENZA rete. Un
# contratto che rifiuta bene e' meta' del contratto (§2.8);
# l'altra meta' richiede il fornitore vivo e non appartiene qui.

[[tests]]
name   = "numero_mancante_rifiutato"
input  = { repo = "o/n" }
expect = { ok = false, error_contains = "Argomento obbligatorio mancante" }

[[tests]]
name   = "provider_sconosciuto_rifiutato"
input  = { repo = "o/n", number = 1, client = "gitlab" }
expect = { ok = false, error_contains = "Operazione non applicabile per questo provider" }
