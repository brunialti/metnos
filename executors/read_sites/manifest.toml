# Manifest executor `read_sites` — dominio sites F1 (spec §3.4).
manifest_format = "1.0"
executor_standard = "metnos.executor/1.0"

name        = "read_sites"
version     = "0.2.2"
timeout_s   = 120
platforms   = ["linux"]
author      = "Roberto Brunialti"
affinity    = [
    "leggi il sito", "leggi la pagina", "dimmi cosa c'è", "screenshot del sito",
    "read the site", "read the page", "what's on the site", "site content",
    "mostra il portale", "leggi dal portale",
]

[description]
it = "SCOPO: legge le pagine osservate durante la raccolta, altrimenti la pagina corrente della sessione (post-login se autenticata). PATTERN: open_sites -> read_sites(from_step=1). NON: pagina pubblica senza sessione -> read_urls_html. OUT: entries=[{session_id,url,title,text,screenshot_path,sensitive}], una per fonte con URL e titolo propri; current_pages = pagina corrente fuori raccolta; gallery."
en = "SCOPO: reads the pages observed during collection, otherwise the session's current page (post-login if authenticated). PATTERN: open_sites -> read_sites(from_step=1). NON: public sessionless page -> read_urls_html. OUT: entries=[{session_id,url,title,text,screenshot_path,sensitive}], one per source with its own URL and title; current_pages = current page outside the collection; gallery."

[code]
files  = ["read_sites.py"]
digest = "sha256:fba2fb0ece6677bd9eefb6087ff5074e557c214600c090ef7ad13698be7c4bbe"

[args]
type     = "object"
required = ["session_ids"]

[args.properties.source_metadata]
type = "array"
items = { type = "object" }
runtime_resolved = true
from_result_key = "source_metadata"

[args.properties.source_metadata.description]
it = "Provenienza e incompletezza dichiarate dai produttori runtime. Iniettate automaticamente; non sono dati delle righe né istruzioni del modello."
en = "Provenance and incompleteness declared by runtime producers. Injected automatically; neither row data nor model instructions."

[args.properties.session_ids]
type = "array"
from_entries_key = "session_id"

[args.properties.session_ids.description]
it = "Lista di session_id (da open_sites/login_sites, tipicamente via from_step). Dominio CHIUSO: match esatto."
en = "List of session_ids (from open_sites/login_sites, typically via from_step). CLOSED domain: exact match."

[args.properties.include_screenshot]
type = "boolean"
default = true

[args.properties.include_screenshot.description]
it = "Se true (default), cattura uno screenshot REDATTO della sola pagina corrente (campi segreti oscurati dal broker) e lo mostra in chat."
en = "If true (default), captures a REDACTED screenshot of the current page only (secret fields blacked out by the broker) and shows it in chat."

[args.properties.include_forms]
type = "boolean"
default = false

[args.properties.include_forms.description]
it = "Se true, include un riassunto dei moduli della sola pagina corrente. Default false."
en = "If true, includes a summary of the forms on the current page only. Default false."

[output]
schema_inline = """
{
  ok: bool,
  source_metadata?: Array<object>,
  entries: Array<{session_id: str, ok: bool, url?: str, title?: str, text?: str,
                  forms?: Array, screenshot_path?: str, sensitive?: bool,
                  reason_code?: str}>,
  current_pages?: Array<{session_id: str, ok: bool, url: str, title: str,
                        forms?: Array, screenshot_path?: str, sensitive: bool}>,
  attachments?: Array<{kind: str, path: str, basename: str, mime: str, sensitive: bool}>,
  no_frontier?: bool,
  error?: str, error_class?: str
}
"""

[presentation]
default_view = "list"

[presentation.list]
mode = "table"
columns = [
  { key = "title", source = ["title", "url", "session_id"], cell_max = 180 },
  { key = "url", source = "url", cell_max = 240 },
  { key = "ok", source = "ok", cell_max = 16 },
  { key = "sensitive", source = "sensitive", cell_max = 16 },
]
max_rows = 200
max_chars = 16000
overflow = "notice"
[[capabilities]]
name = "network:sites"
hint = ["*"]

[[tests]]
name   = "manca_session_ids"
input  = {}
expect = { ok = false, field_eq = { error_class = "invalid_args" } }

[[tests]]
name   = "session_ids_vuota"
input  = { session_ids = [] }
expect = { ok = false, field_eq = { error_class = "invalid_args" } }

[placement]
scope     = "server"
device_ok = false
