# Manifest dell'executor `find_issues_db` — Metnos v1.1
# Rinominato da `find_issues` (15/6/2026, ADR 0172): rompe la collisione di nome
# con `find_issues_github`. Questo tool è SOLO la memoria-dedup LOCALE (db), non
# il fetch remoto. Il `_db` distingue deterministicamente le due operazioni.
manifest_format = "1.0"

name        = "find_issues_db"
version     = "0.1.0"
author      = "Roberto Brunialti"
affinity    = ["issue simili", "dedup issue", "gia risolte", "memoria issue", "risposta nota", "db locale issue", "knowledge base issue", "similar resolved issue"]
revertible  = true
lifecycle   = "active"

[description]
it = "SCOPO: cerca nel db LOCALE issue SIMILI gia' risolte (dedup semantico), con risposta accettata. PATTERN: find_issues_db(repo='owner/name', query_text='descrizione issue'). NON: leggere/scaricare issue dal repo GitHub -> find_issues_github; per stato/elenco dal db -> read_issues. Questo NON tocca GitHub, guarda SOLO la memoria locale. OUT: entries=[{ref, similarity, accepted_reply, classification}] per similarity desc."
en = "SCOPO: search the LOCAL db for SIMILAR already-resolved issues (semantic dedup). PATTERN: find_issues_db(repo='owner/name', query_text='issue description'). NON: fetch/read issues from the GitHub repo -> find_issues_github; by status from db -> read_issues. This does NOT touch GitHub, only local memory. OUT: entries=[{ref, similarity, accepted_reply, classification}] by similarity desc."

[code]
files  = ["find_issues_db.py"]
digest = "sha256:f8f988cf4ee5bccff3c20557351ce20580fbae6d0f4bb1bd2383f6aca224c9c3"

[args]
type     = "object"
required = ["repo", "query_text"]

[args.properties.repo]
type = "string"
[args.properties.repo.description]
it = "Repo 'owner/name' su cui cercare le issue simili. Obbligatorio."
en = "Repo 'owner/name' to search similar issues in. Required."

[args.properties.query_text]
type = "string"
[args.properties.query_text.description]
it = "Testo dell'issue da confrontare (titolo o titolo+corpo). Obbligatorio."
en = "Issue text to compare (title or title+body). Required."

[args.properties.top_n]
type    = "integer"
default = 5
[args.properties.top_n.description]
it = "Numero massimo di issue simili da restituire. Default 5."
en = "Max number of similar issues to return. Default 5."

[args.properties.min_similarity]
type    = "number"
default = 0.0
[args.properties.min_similarity.description]
it = "Soglia minima di similarity coseno (0..1) per includere un match. Default 0.0 (tutti). Es. 0.85 per soli match forti."
en = "Min cosine similarity threshold (0..1) to include a match. Default 0.0 (all). E.g. 0.85 for strong matches only."

# ── Tests di nascita (offline: nessun embedder/store richiesto) ──────────
[[tests]]
name   = "missing_repo_fails"
input  = { query_text = "errore install" }
expect = { ok = false, error_contains = "repo" }

[[tests]]
name   = "missing_query_text_fails"
input  = { repo = "owner/name" }
expect = { ok = false, error_contains = "query_text" }
