# Manifest dell'executor `read_urls_html` — Metnos v1.1
# Lettura del contenuto principale di pagine HTML (ADR 0081, 4/5/2026).

manifest_format = "1.0"
executor_standard = "metnos.executor/1.0"

name        = "read_urls_html"
version     = "0.2.0"
timeout_s   = 300
author      = "Roberto Brunialti"
revertible  = false
platforms   = ["linux"]
affinity    = [
    "read", "leggi", "html", "pagina", "page", "url", "web", "site", "article", "articolo",
                "news", "fetch", "scarica", "extract", "estrai", "testo", "content",
                "contenuto", "readability"
            ]

[description]
it = "SCOPO: legge pagine web e ne estrae il testo; URL PDF estratti come testo automaticamente. PATTERN: read_urls_html(urls=[\"https://example.com\"]). NON: solo PDF noti (-> read_urls_pdf); ricerca URL (-> find_urls). OUT: entries=[{url,title,body_text,meta,lang,fetched_at}]."
en = "SCOPO: reads web pages and extracts main text; PDF URLs extracted as text automatically. PATTERN: read_urls_html(urls=[\"https://example.com\"]). NON: PDF-only lists (-> read_urls_pdf); URL discovery (-> find_urls). OUT: entries=[{url,title,body_text,meta,lang,fetched_at}]."

[code]
files  = ["read_urls_html.py"]
digest = "sha256:89c628ab57a4489a6c577aa2d451d305a7002dbd2cb48afedf1617704c0498b2"

[args]
type     = "object"
required = ["urls"]

[args.properties.urls]
type        = "array"

[args.properties.urls.description]
it = "Lista di URL HTTP/HTTPS da leggere come HTML. Anche un singolo URL passato come array a 1 elemento. Esempio: ['https://news.example.org/articolo-1']. In pipeline ricevi via from_step dall'output di find_urls."
en = "List of HTTP/HTTPS URLs to be read as HTML. Even a single URL passed as a 1-element array. Example: ['https://news.example.org/article-1']. In the pipeline, you receive this via from_step from the output of find_urls."

[args.properties.auth_cookies_file]
type        = "string"
runtime_resolved = true

[args.properties.auth_cookies_file.description]
it = "Path a un file Mozilla cookies.txt (formato Netscape). Tutti i cookie validi per gli URL passati vengono iniettati nelle Request. Esempio: '~/.config/metnos/cookies/web.spaggiari.eu.txt'."
en = "Path to a Mozilla cookies.txt file (Netscape format). All cookies valid for the passed URLs are injected into the Requests. Example: '~/.config/metnos/cookies/web.spaggiari.eu.txt'."

[args.properties.timeout_s]
type        = "number"
default     = 10.0
minimum     = 1.0
maximum     = 60.0

[args.properties.timeout_s.description]
it = "Timeout per singola richiesta HTTP, in secondi. Default 10.0."
en = "Timeout for single HTTP request, in seconds. Default 10.0."

[args.properties.max_bytes]
type        = "integer"
minimum     = 0
default     = 2000000

[args.properties.max_bytes.description]
it = "Tetto sui byte letti per pagina. Default 2000000 (2 MB)."
en = "Cap on bytes read per page. Default 2000000 (2 MB)."

[args.properties.cache_ttl_s]
type        = "integer"
minimum     = 0
default     = 900

[args.properties.cache_ttl_s.description]
it = "Durata della cache HTTP locale in secondi. 0 disabilita la cache; default 900. Non cambia il contenuto autorizzato né amplia gli host accessibili."
en = "Local HTTP cache lifetime in seconds. 0 disables the cache; default 900. It does not change authorized content or widen accessible hosts."

[args.properties.follow_iframes]
type        = "boolean"
default     = true

[args.properties.follow_iframes.description]
it = "Se true, una pagina quasi vuota può seguire al massimo un iframe dello stesso host. Iframe cross-host non vengono seguiti."
en = "When true, an almost-empty page may follow at most one same-host iframe. Cross-host iframes are never followed."

[args.properties.include_failures_as_entries]
type        = "boolean"
default     = false

[args.properties.include_failures_as_entries.description]
it = "Modalità audit: include nell'output entries anche una riga strutturata per ogni URL non leggibile, preservando comunque ok_count e fail_count reali. Default false."
en = "Audit mode: also include one structured entry for each unreadable URL, while preserving the real ok_count and fail_count. Default false."

[args.properties.js_render]
type        = "boolean"
default     = false

[args.properties.js_render.description]
it = "Opt-in JS-rendering via sidecar Playwright (ADR 0125). Quando true e il sidecar e' UP (porta 8771), le pagine SPA con error_class=js_rendered vengono re-richieste al sidecar che renderizza JS in Chromium headless e ritorna l'HTML finale. Costo: ~500ms-2s extra per pagina + ~200MB RAM lato sidecar. Default false per non rallentare il throughput dei turn normali. Usa SOLO dopo un primo step che ha rilevato error_class=js_rendered (regola js_rendered_retry del planner)."
en = "Opt-in JS-rendering via Playwright sidecar (ADR 0125). When true and the sidecar is UP (port 8771), SPA pages with error_class=js_rendered are re-requested to the sidecar which renders JS in headless Chromium and returns the final HTML. Cost: ~500ms-2s extra per page + ~200MB RAM on the sidecar. Default false to avoid slowing normal turn throughput. Use ONLY after a first step that detected error_class=js_rendered (planner rule js_rendered_retry)."

[args.properties.client]
type        = "string"
enum        = ["httpx", "playwright"]
default     = "httpx"
# config non-intento (lessons A3/B1): risolta dal runtime, NON esposta
# all'LLM. Politica: tests/runtime/infra/test_config_args_marking_policy.py.
runtime_resolved = true

[args.properties.client.description]
it = "Backend di implementazione (default 'httpx' = urllib stdlib + HostThrottle + HttpCache, no JS). 'playwright' = sidecar Chromium headless come dispatcher esclusivo (stub: non ancora attivo). Per JS-render opt-in selettivo usa il flag `js_render=true` con client='httpx'. Plugin esterni futuri potranno aggiungere altri client."
en = "Backend implementation (default 'httpx' = urllib stdlib + HostThrottle + HttpCache, no JS). 'playwright' = headless Chromium sidecar as exclusive dispatcher (stub: not yet active). For selective opt-in JS-rendering use the `js_render=true` flag with client='httpx'. Future external plugins may add other clients."

[placement]
scope = "server"
device_ok = false

[output]
schema_inline = """
{
  ok: bool,
  ok_count: int,
  fail_count: int,
  partial?: bool,
  entries: Array<{
    url: str,
    origin: str,
    requested_url: str,
    final_url: str,
    domain: str,
    title: str,
    body_text: str,
    meta: object,
    lang?: str | null,
    language: str,
    date: str,
    text_length: int,
    status: str,
    confidence: float,
    redirected: bool,
    iframe_count: int,
    js_required: bool,
    error: str,
    fetched_at: number,
    content_kind?: 'html' | 'pdf',
    iframe_urls?: Array<str>,
    linked_documents?: Array<object>,
    js_rendered?: bool,
    js_signals?: Array<str>,
    notice?: str | null,
    error_class?: str
  }>,
  failed: Array<{
    url: str,
    error: str,
    error_class: str,
    error_code?: str
  }>,
  js_render_count?: int,
  js_render_attempted?: int,
  js_render_sidecar_available?: bool,
  js_render_auto?: bool,
  error?: str,
  error_class?: str,
  error_code?: str
}
"""

[[capabilities]]
name = "network:http"
hint = ["http://*", "https://*"]

[[capabilities]]
name = "fs:read"
hint = ["arg:auth_cookies_file"]

[[tests]]
name   = "errore_se_args_non_oggetto"
input  = []
expect = { ok = false, field_eq = { error_code = "args_not_object" } }

[[tests]]
name   = "errore_se_urls_mancante"
input  = {}
expect = { ok = false, field_eq = { error_code = "urls_missing" } }

[[tests]]
name   = "errore_se_urls_non_lista"
input  = { urls = 123 }
expect = { ok = false, error_contains = "list", field_eq = { error_code = "urls_not_array" } }

[[tests]]
name   = "lista_vuota_ok"
input  = { urls = [] }
expect = { ok = true, metadata_field_eq = { ok_count = 0, fail_count = 0 } }
