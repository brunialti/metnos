# Manifest dell'executor `compute_lists` — Metnos (ADR 15/5/2026).
# Operatori logici/aggregati su una o due liste di entries.

manifest_format = "1.0"

name        = "compute_lists"
version     = "0.1.0"
author      = "Roberto Brunialti <roberto.brunialti@metnos.com>"
affinity    = ["intersect", "intersezione", "union", "unione",
                "differenza", "difference", "overlap", "sovrappone",
                "sovrapposizione", "in comune", "operazioni liste",
                "set", "AND tra liste"]

[description]
it = """Operatori logici e aggregati su una o due liste di entries. Pattern §7.3 general-purpose: invece di creare un executor per ogni operazione (intersect_entries, union_entries, ecc.), `compute_lists` parametrizza via `op` + `on_keys`.

USO CORRETTO:
- AND fra 2 liste su una chiave: op='intersect', from_step=A, with_step=B, on_keys=['path']
- AND temporale (overlap eventi): op='overlap', from_step=A, with_step=B (auto-detect start/end)
- A \\ B (entries di A non in B): op='difference', on_keys=['id']
- A ∪ B deduplicato: op='union', on_keys=['sha256']
- (A\\B) ∪ (B\\A): op='symdiff', on_keys=['date']
- Conteggio: op='count', from_step=A → {value: N}
- Somma campo: op='sum', from_step=A, field='size' → {value: total}
- Media/min/max/prod: op='avg/min/max/prod', field='X'

Patter pipeline classico (test 4 «HLT che si sovrappone con MNM»):
1. read_events(time_window='next-3m')  → tutti gli eventi
2. filter_entries(from_step=1, where_field='summary', where_starts_with='HLT')  → A
3. filter_entries(from_step=1, where_field='summary', where_starts_with='MNM')  → B
4. compute_lists(op='overlap', from_step=2, with_step=3) → A ∩temporal B
5. final_answer

NON CONFONDERE CON:
- `filter_entries`: filtri MONO-LISTA (where_field/where_in/where_starts_with). compute_lists e' BI-LISTA (set ops) o MONO-LISTA + agg.
- `compute_entries`: aggregati su numeri/stringhe (max/min/avg/sum). Sovrapposizione parziale per op aggregativi — preferisci compute_lists quando in pipeline con set ops.

DEVI: passare `op` (uno fra: intersect, union, difference, symdiff, overlap, sum, prod, avg, min, max, count).
DEVI: per set ops (≠overlap), passare `on_keys` come lista di field name.
DEVI: per aggregati (sum/prod/avg/min/max), passare `field` (campo numerico).
NON DEVI: usare set ops senza `with_step` (manca la lista B).
NON DEVI: usare op='overlap' su liste senza campi temporali — restituisce vuoto.

OUTPUT:
- set ops: `{ok, op, entries: list[dict], metadata: {count_a, count_b, count_out, on_keys}}`
- overlap: `{ok, op, entries: list[dict], metadata: {count_a, count_b, count_out, auto_detect_temporal: true}}`. Entries hanno `_overlap_with` con label degli incontri.
- aggregati: `{ok, op, value: number, count, metadata: {count_a, field}}`."""
en = """Logical and aggregate operators on one or two lists of entries. General §7.3 pattern: instead of creating one executor per operation (intersect_entries, union_entries, etc.), `compute_lists` parametrizes via `op` + `on_keys`.

CORRECT USE:
- AND between 2 lists on a key: op='intersect', from_step=A, with_step=B, on_keys=['path']
- Temporal AND (event overlap): op='overlap', from_step=A, with_step=B (auto-detect start/end)
- A \\ B: op='difference', on_keys=['id']
- A ∪ B deduped: op='union', on_keys=['sha256']
- Symmetric diff: op='symdiff', on_keys=['date']
- Count: op='count', from_step=A → {value: N}
- Sum field: op='sum', from_step=A, field='size' → {value: total}
- Avg/min/max/prod: op='avg/min/max/prod', field='X'

Classic pipeline (test 4 'HLT overlapping with MNM'):
1. read_events(time_window='next-3m') → all events
2. filter_entries(from_step=1, where_field='summary', where_starts_with='HLT') → A
3. filter_entries(from_step=1, where_field='summary', where_starts_with='MNM') → B
4. compute_lists(op='overlap', from_step=2, with_step=3) → A ∩temporal B
5. final_answer

DO NOT CONFUSE WITH:
- `filter_entries`: MONO-list filters (where_field/where_in/where_starts_with). compute_lists is BI-list (set ops) or MONO-list + agg.
- `compute_entries`: numeric/string aggregates (max/min/avg/sum). Partial overlap on aggregate ops — prefer compute_lists when in pipeline with set ops.

MUST: pass `op` (one of: intersect, union, difference, symdiff, overlap, sum, prod, avg, min, max, count).
MUST: for set ops (≠overlap), pass `on_keys` as list of field names.
MUST: for aggregates (sum/prod/avg/min/max), pass `field` (numeric).
MUST NOT: use set ops without `with_step` (missing list B).
MUST NOT: use op='overlap' on lists without temporal fields — returns empty.

OUTPUT:
- set ops: `{ok, op, entries: list[dict], metadata: {count_a, count_b, count_out, on_keys}}`
- overlap: `{ok, op, entries: list[dict], metadata: {count_a, count_b, count_out, auto_detect_temporal: true}}`. Entries have `_overlap_with` with overlap labels.
- aggregates: `{ok, op, value: number, count, metadata: {count_a, field}}`."""

[code]
files  = ["compute_lists.py"]
digest = "sha256:abdc505c32ab66fa3131a564fc28e489bb73743403c982771ee2a451ba4ff693"

[args]
type     = "object"
required = ["op"]

[args.properties.op]
type        = "string"
enum        = ["intersect", "union", "difference", "symdiff", "overlap",
               "sum", "prod", "avg", "min", "max", "count"]

[args.properties.op.description]
it = "Operazione. Set ops (intersect/union/difference/symdiff) richiedono with_step + on_keys. Overlap e' alias shortcut: AND temporale auto-detect (no on_keys necessario). Aggregati (sum/prod/avg/min/max) richiedono field. Count nessun arg extra."
en = "Operation. Set ops (intersect/union/difference/symdiff) require with_step + on_keys. Overlap is shortcut alias: temporal AND auto-detect (no on_keys needed). Aggregates (sum/prod/avg/min/max) require field. Count needs no extra arg."

[args.properties.from_step]
type        = "integer"
minimum     = 1

[args.properties.from_step.description]
it = "Step della lista PRIMARIA (A). Il runtime espande in entries via scratchpad."
en = "Step of PRIMARY list (A). Runtime expands to entries via scratchpad."

[args.properties.with_step]
type        = "integer"
minimum     = 1

[args.properties.with_step.description]
it = "Step della lista SECONDARIA (B), per set ops. Il runtime espande e inietta come `entries_b`."
en = "Step of SECONDARY list (B), for set ops. Runtime expands and injects as `entries_b`."

[args.properties.on_keys]
type        = "array"
items       = { type = "string" }

[args.properties.on_keys.description]
it = "Lista field name su cui matchare le entries. MATCH ESATTO sui valori (wildcard NON supportati: per pattern usa filter_entries upstream). Composite: on_keys=['lat','lon'] matcha la coppia. Es. on_keys=['path'] per file, on_keys=['id'] per eventi, on_keys=['sha256'] per dedupe."
en = "List of field names to match entries on. EXACT MATCH on values (wildcards NOT supported: for patterns use filter_entries upstream). Composite: on_keys=['lat','lon'] matches the pair. E.g. on_keys=['path'] for files, on_keys=['id'] for events, on_keys=['sha256'] for dedupe."

[args.properties.field]
type        = "string"

[args.properties.field.description]
it = "Field name per aggregati numerici (sum/prod/avg/min/max). Es. field='size' su entries con campo size."
en = "Field name for numeric aggregates (sum/prod/avg/min/max). E.g. field='size' on entries with size field."

[args.properties.entries]
type        = "array"

[args.properties.entries.description]
it = "Lista PRIMARIA inline (alternativa a from_step). Solitamente non passata direttamente dal PLANNER — il runtime la inietta da from_step."
en = "Inline PRIMARY list (alternative to from_step). Usually not passed directly by PLANNER — runtime injects from from_step."

[args.properties.entries_b]
type        = "array"

[args.properties.entries_b.description]
it = "Lista SECONDARIA inline (alternativa a with_step). Solitamente non passata direttamente."
en = "Inline SECONDARY list (alternative to with_step). Usually not passed directly."

[[tests]]
name   = "intersect_path"
input  = { op = "intersect", entries = [{path="a"},{path="b"},{path="c"}], entries_b = [{path="b"},{path="c"},{path="d"}], on_keys = ["path"] }
expect = { ok = true, metadata_field_eq = { count_out = 2 } }

[[tests]]
name   = "difference_id"
input  = { op = "difference", entries = [{id=1},{id=2},{id=3}], entries_b = [{id=2}], on_keys = ["id"] }
expect = { ok = true, metadata_field_eq = { count_out = 2 } }

[[tests]]
name   = "union_dedup"
input  = { op = "union", entries = [{k="a"},{k="b"}], entries_b = [{k="b"},{k="c"}], on_keys = ["k"] }
expect = { ok = true, metadata_field_eq = { count_out = 3 } }

[[tests]]
name   = "count"
input  = { op = "count", entries = [{x=1},{x=2},{x=3},{x=4}] }
expect = { ok = true }

[[tests]]
name   = "sum_field"
input  = { op = "sum", entries = [{size=10},{size=20},{size=30}], field = "size" }
expect = { ok = true }

[[tests]]
name   = "overlap_temporal"
input  = { op = "overlap", entries = [{start="2026-01-01T10:00:00", end="2026-01-01T11:00:00"}], entries_b = [{start="2026-01-01T10:30:00", end="2026-01-01T11:30:00"}] }
expect = { ok = true, metadata_field_eq = { count_out = 1 } }
