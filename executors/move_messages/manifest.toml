# Manifest dell'executor `move_messages` — Metnos v1.1 (24/5/2026).
# Naming compositivo §2.2: verbo_oggetto_plurale. Vettoriale per costruzione.
# Reversibile §2.3: swap_src_dst (folder ↔ folder).

manifest_format = "1.0"
executor_standard = "metnos.executor/1.0"

name        = "move_messages"
version     = "0.2.2"
platforms   = ["linux"]
lifecycle   = "active"
author      = "Roberto Brunialti"
affinity = [
    "move", "sposta", "muovi", "trasferisci",
    "messages", "messaggi", "mail", "email", "posta",
    "cestino", "trash", "spam", "junk",
    "indesiderata", "archivio", "archive",
    "folder", "cartella", "label", "etichetta",
]

revertible = true
reverse_pattern = "swap_src_dst"

[description]
it = "SCOPO: sposta messaggi tra cartelle o etichette. PATTERN: read_messages(...) -> move_messages(from_step=1, dst_folder=\"Trash\"). Per ID IMAP diretti fornisci account e src_folder. NON: cambiare solo etichette (-> set_messages) o cancellare. OUT: results=[...]."
en = "SCOPO: move messages between folders or labels. PATTERN: read_messages(...) -> move_messages(from_step=1, dst_folder=\"Trash\"). For direct IMAP IDs provide account and src_folder. NON: change labels only (-> set_messages) or delete. OUT: results=[...]."

[code]
files  = ["move_messages.py"]
digest = "sha256:4c8201931b21bdbf8ec14db55a8cd3c91fb6b727eb9eb2b93d0eb5f495ec4ee0"

[args]
type = "object"
# §7.3 vincolo disgiuntivo (25/5/2026): almeno uno fra message_ids,
# message_id o from_step deve essere fornito non-vuoto. Senza, il
# PLANNER tende a inventare ID plausibili (es. "msg_1") che falliscono
# IMAP COPY. Validato dal runtime (validate_args), niente teaching
# ad-hoc nella description.
requires_one_of = [["message_ids", "message_id", "from_step"]]

[args.properties.message_ids]
type  = "array"
items = { type = "string" }
# §7.3 (25/5/2026): rifiuta valori sintetici (msg_1, mail_2, id_3) che
# il PLANNER inventa quando non passa from_step. IMAP COPY fallisce
# comunque su UID inventati, ma il check schema fail prima con hint
# chiaro («usa from_step»).
forbid_placeholder_values = true
# §7.3 da_entries_key: quando from_step espande entries → message_ids,
# usa entries[*].uid (UID IMAP, valido per COPY) invece del singular
# naive "message_id" (RFC822 header, NON valido per COPY/operations).
from_entries_key = "uid"

[args.properties.message_ids.description]
it = "Lista di id messaggi (Gmail) o UID IMAP. Esempio: [\"18b3c4...\"]. MATCH ESATTO, wildcard NON supportati."
en = "List of message IDs (Gmail) or UIDs (IMAP). Example: [\"18b3c4...\"]. EXACT MATCH, wildcards NOT supported."

[args.properties.message_id]
type = "string"

[args.properties.message_id.description]
it = "Singolo id messaggio (alternativo a message_ids per N=1)."
en = "Single message ID (alternative to message_ids for N=1)."

[args.properties.dst_folder]
type = "string"

[args.properties.dst_folder.description]
it = "Cartella o etichetta di destinazione. Accetta nomi utente come 'Trash', 'Cestino', 'Spam', 'Archivio' o un nome arbitrario; il backend li risolve nella propria cartella/label canonica."
en = "Destination folder or label. Accepts user-facing names such as 'Trash', 'Junk', 'Spam', 'Archive', or an arbitrary name; each backend resolves its canonical folder/label."

[args.properties.src_folder]
type    = "string"
# `from_step` may carry UIDs read from a non-default folder.  The projection
# layer injects this value only when every source entry agrees.
from_entries_key = "folder"
from_entries_required = { arg = "client", values = ["metnos"] }

[args.properties.src_folder.description]
it = "Solo IMAP: obbligatoria insieme ad account quando gli ID sono forniti direttamente; con from_step viene derivata dai risultati di origine. Ignorata per Gmail."
en = "IMAP only: required together with account when IDs are supplied directly; with from_step it is derived from the source results. Ignored for Gmail."

[args.properties.account]
type    = "string"
# UIDs are scoped to a mailbox.  Preserve that producer context across the
# pipeline instead of relying on the consumer default or planner repetition.
from_entries_key = "account"
from_entries_required = { arg = "client", values = ["metnos"] }

[args.properties.account.description]
it = "Solo IMAP: obbligatorio insieme a src_folder quando gli ID sono forniti direttamente; con from_step viene derivato dai risultati di origine. Ignorato per Gmail."
en = "IMAP only: required together with src_folder when IDs are supplied directly; with from_step it is derived from the source results. Ignored for Gmail."

[args.properties.via_channel]
type    = "string"
enum    = ["email", "mail"]
default = "email"

[args.properties.via_channel.description]
it = "Canale: 'email' (default). 'mail' alias storico."
en = "Channel: 'email' (default). 'mail' historical alias."

[args.properties.client]
type    = "string"
enum    = ["metnos", "google_workspace"]
default = "metnos"

[args.properties.client.description]
it = "Backend: 'metnos' (IMAP), 'google_workspace' (Gmail API). MATCH ESATTO."
en = "Backend: 'metnos' (IMAP), 'google_workspace' (Gmail API). EXACT MATCH."

[output]
schema_inline = """
{
  ok: bool,
  ok_count: int,
  fail_count: int,
  partial?: bool,
  results: Array<object>,
  failed: Array<object>,
  error?: str, error_class?: str, error_code?: str
}
"""

[[capabilities]]
name = "mail:write"
hint = ["imap:move", "gmail:labels.modify"]

[[capabilities]]
name = "provider:access"
hint = ["google-workspace"]
when = { arg = "client", values = ["google_workspace"] }

[placement]
scope = "server"
device_ok = false

[[tests]]
name   = "args_invalidi_no_ids"
input  = { dst_folder = "Trash" }
expect = { ok = false }

[[tests]]
name   = "args_invalidi_no_dst"
input  = { message_ids = ["x"] }
expect = { ok = false }

[[tests]]
name   = "args_invalidi_client_sconosciuto"
input  = { message_ids = ["x"], dst_folder = "Trash", client = "outlook" }
expect = { ok = false, error_contains = "Operazione non applicabile per questo provider" }

[[tests]]
name   = "args_invalidi_lista_vuota_ids"
input  = { message_ids = [], dst_folder = "Trash" }
expect = { ok = false }
