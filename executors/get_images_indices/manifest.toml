# Manifest dell'executor `get_images_indices` — Metnos v1.1
# Naming compositivo: azione_oggetto[_modalita'] (verb=get, obj=images,
# modalita'=indices). ADR 0086 (rinominato 5/5/2026).

manifest_format = "1.0"
executor_standard = "metnos.executor/1.0"

name        = "get_images_indices"
version     = "0.3.0"
author      = "Roberto Brunialti"
affinity    = ["status", "introspection", "indice", "index", "stato", "snapshot", "info", "foto", "image"]
revertible  = false
platforms   = ["linux"]

[placement]
scope = "server"
device_ok = false

[description]
it = "SCOPO: ottiene lo stato dell'indice immagini unificato per un corpus o per tutti. PATTERN: get_images_indices(); oppure base_path=\"/img\". NON: costruire indici (-> create_images_indices); cercare foto (-> find_images_indices). OUT: entries con n_entries (tutti i record), n_indexed (foto indicizzate), n_not_indexed (foto non decodificabili). Totali: total_records, indexed_entries_total, not_indexed_entries_total. Un indice esistente può contenere solo record negativi: non significa che le foto siano state indicizzate."
en = "SCOPO: get unified image-index status for one corpus or all corpora. PATTERN: get_images_indices(); or base_path=\"/img\". NON: build indexes (-> create_images_indices); search photos (-> find_images_indices). OUT: entries with n_entries (all records), n_indexed (indexed photos), n_not_indexed (undecodable photos). Totals: total_records, indexed_entries_total, not_indexed_entries_total. An existing index can contain only negative records: this does not mean the photos were indexed."

[code]
files  = ["get_images_indices.py"]
digest = "sha256:b560a7f62a249f727e8ff7f9f4e7cd4500b723c32d64edf9f222d1782daeeb38"

[args]
type     = "object"
required = []

[args.properties.base_path]
type        = "string"

[args.properties.base_path.description]
it = "Directory radice opzionale della collezione. Se omessa, elenca tutti gli indici unificati materializzati senza scandire gli alberi foto."
en = "Optional collection root. If omitted, lists every materialized unified index without scanning photo trees."

[args.properties.idx]
type        = "string"
enum        = ["unified", "scene", "persons", "gps", "all"]
default     = "all"

[args.properties.idx.description]
it = "Indice da ispezionare. 'all' e 'unified' indicano lo storage v4 attivo; scene/persons/gps servono solo a diagnosticare layout v3 obsoleti."
en = "Index to inspect. 'all' and 'unified' select active v4 storage; scene/persons/gps only diagnose obsolete v3 layouts."

[output]
schema_inline = """
{
  ok: bool,
  base_path?: str,
  index_root?: str,
  entries?: [{idx: str, exists: bool, base_path?: str, index_path?: str, size_bytes?: int, size_mb?: number, n_entries?: int, n_indexed?: int, n_not_indexed?: int, n_faces?: int, last_refresh_at?: str | number | null, model?: str | null, model_face?: str | null, model_image?: str | null, dim?: int | null, version?: int}],
  n_entries?: int,
  indexed_entries_total?: int,
  total_records?: int,
  not_indexed_entries_total?: int,
  ok_count?: int,
  fail_count?: int,
  partial?: bool,
  failed?: [{idx: str, index_path: str, error: str, error_class: str, error_code: str, detail?: str}],
  error?: str,
  error_class?: 'invalid_input',
  error_code?: str
}
"""

[[capabilities]]
name = "index:read"
hint = ["image"]

[[tests]]
name   = "base_path_qualunque_ok_lista_anche_se_vuota"
input  = { base_path = "/tmp/metnos_test_idx_get_inexistent", idx = "all" }
expect = { ok = true }

[[tests]]
name   = "idx_invalido_fallisce"
input  = { base_path = "/tmp/metnos_test_idx_get", idx = "pippo" }
expect = { ok = false, error_contains = "idx" }

[[tests]]
name   = "discovery_senza_base_path"
input  = {}
expect = { ok = true }
