manifest_format = "1.0"
executor_standard = "metnos.executor/1.0"
name        = "set_signatures"
version     = "0.3.0"
author      = "Roberto Brunialti"
affinity    = ["imposta", "autorizza", "vieta", "permetti", "rimuovi",
                "curatela", "gestione signatures", "configura permessi",
                "approva comando", "blocca comando", "set signature",
                "authorize command", "allow command", "deny command",
                "blacklist command", "whitelist command", "remove signature"]

revertible       = true
reverse_pattern  = "module.reverse"

[output]
schema_inline = "{ ok: bool, signature?: string, kind?: string, severity?: string, source?: string, removed?: bool, previous_kind?: string, message?: string, error?: string, _undo: {outcome: string, state_receipt?: object} }"

[undo]
outcome = "per_execution"

[[capabilities]]
name = "fs:write"
hint = ["~/.config/metnos/**", "~/.local/share/metnos/**"]

[[tests]]
name = "missing_kind"
input = { signature = "x" }
expect = { ok = false }

[description]
it = "SCOPO: imposta o rimuove signature e registra lo stato esatto per l'annullamento, salvo `forbidden`. PATTERN: set_signatures(kind=\"blacklist\", signature=\"bin:cmd:kind\", reason=\"motivo\"). NON: calcolo -> compute_signatures; lettura -> get_signatures. OUT: {signature,kind,removed?,message,_undo}."
en = "SCOPO: sets or removes signatures and records exact state for undo, except `forbidden`. PATTERN: set_signatures(kind=\"blacklist\", signature=\"bin:cmd:kind\", reason=\"reason\"). NON: compute -> compute_signatures; read -> get_signatures. OUT: {signature,kind,removed?,message,_undo}."

[code]
files  = ["set_signatures.py"]
digest = "sha256:5e975030b99cfac4b61a8b35fe4410f2cf20bed0d4b4703b152da117bb69b173"

[args]
type     = "object"
required = ["kind", "signature"]

[args.properties.kind]
type        = "string"
enum        = ["blacklist", "whitelist", "unknown"]

[args.properties.kind.description]
it = "Stato target. 'blacklist'/'whitelist' = aggiungi/sposta. 'unknown' = rimuovi dal DB."
en = "Target state. 'blacklist'/'whitelist' = add/move. 'unknown' = remove from DB."

[args.properties.signature]
type        = "string"

[args.properties.signature.description]
it = "Signature canonicalizzata (binary:subcmd:target_kind). Wildcard ammessi nei campi 2 e 3."
en = "Canonicalized signature (binary:subcmd:target_kind). Wildcards allowed in fields 2 and 3."

[args.properties.reason]
type        = "string"

[args.properties.reason.description]
it = "Motivazione della scelta. Richiesta per kind='blacklist'/'whitelist'. Visibile in audit."
en = "Reason for choice. Request for kind='blacklist'/'whitelist'. Visible in audit."

[args.properties.severity]
type        = "string"
enum        = ["forbidden", "irreversible", "dangerous", "reversible"]
default     = "dangerous"

[args.properties.severity.description]
it = "Per kind='blacklist': severity. 'forbidden' = Legge 1 non derogabile (raro). Default 'dangerous'. Ignorato per altri kind."
en = "For kind='blacklist': severity. 'forbidden' = Non-derogable Law 1 (rare). Default 'dangerous'. Ignored for other kinds."
