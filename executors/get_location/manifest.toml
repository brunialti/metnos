# Manifest dell'executor `get_location` — Metnos v1.1
# Eccezione singolare al naming convention: l'utente ha UNA posizione corrente
# per actor; il plurale `get_locations` sara' aggiunto se servira' la storia.

manifest_format = "1.0"
executor_standard = "metnos.executor/1.0"

name        = "get_location"
version     = "0.2.0"
platforms   = ["linux"]
author      = "Roberto Brunialti"
affinity    = ["location", "posizione", "dove", "where", "GPS", "qui", "now", "current"]
revertible  = false
lifecycle   = "active"

[description]
it = "SCOPO: dice dove si trova l'attore corrente. PATTERN: get_location(). NON: geocodificare un nome di luogo -> find_places; cercare luoghi vicini -> get_places; leggere la cronologia. OUT: {location:{lat,lon,source,accuracy_m},age_seconds?,actor}. Prova in ordine posizione condivisa, configurata, WiFi e IP; `source` dice quale ha risposto e `ip` vale una citta', non una posizione."
en = "SCOPO: tells where the current actor is. PATTERN: get_location(). NON: geocode a place name -> find_places; look for nearby places -> get_places; read the history. OUT: {location:{lat,lon,source,accuracy_m},age_seconds?,actor}. Tries in order shared, configured, WiFi and IP; `source` states which one answered, and `ip` is worth a city, not a position."

[code]
files  = ["get_location.py"]
digest = "sha256:e7fb10707911ec04a5d62fced0b93ea232160be3b897f35ec7bf59d09c61410e"

[args]
type     = "object"

[args.properties.actor]
type        = "string"
default     = "host"
runtime_resolved = true

[args.properties.actor.description]
it = "Identificativo dell'utente di cui leggere la posizione. Default 'host' (l'utente principale). In multi-user (futuro): 'guest:<id>' per i membri della famiglia pairati."
en = "Identifier of the user whose location is to be read. Default 'host' (the main user). In multi-user (future): 'guest:<id>' for paired family members."

[args.properties.verify]
type    = "boolean"
default = false

[args.properties.verify.description]
it = "Metti true SOLO se l'utente chiede di RIDETERMINARE o verificare dove si trova adesso (es. «ricontrolla dove sono», «verifica la posizione»). La risposta confronta la posizione configurata con quella rilevata sul momento. Per una domanda che si limita a presupporre la posizione, lascia false."
en = "Set true ONLY if the user asks to RE-DETERMINE or verify where they are right now (e.g. \"check where I am again\", \"verify my position\"). The answer compares the configured position with the one detected on the spot. For a question that merely presupposes the position, leave false."

[output]
schema_inline = """
{
  ok: bool,
  location?: {
    lat: float, lon: float, ts: float,
    source: "shared" | "configured" | "wifi" | "ip",
    accuracy_m: float | null,
    accuracy?: float | null, channel?: str | null,
    label?: str, access_points?: int, via_tunnel?: bool
  },
  entries?: [ { gps: {lat: float, lon: float}, lat: float, lon: float,
                source: str } ],
  detected?: { lat: float, lon: float, source: str, accuracy_m: float | null },
  verified?: bool,
  age_seconds?: int,
  actor?: str,
  error?: str, error_class?: str, error_code?: str
}
"""

[[capabilities]]
name = "fs:read"
hint = ["~/.local/share/metnos/locations.jsonl",
        "~/.config/metnos/location.toml"]

# Solo le due sorgenti dedotte: beaconDB per gli access point visibili e la
# geolocalizzazione dall'IP pubblico. La posizione condivisa e quella
# configurata non toccano la rete.
[[capabilities]]
name = "network:http"
hint = ["api.beacondb.net", "ipapi.co"]

# `iw dev <if> scan dump` legge la cache di scansione del kernel (nessun
# privilegio) e `ip route get` riconosce una rotta di default in tunnel: con
# una VPN attiva l'IP racconta dove esce il tunnel, non dove sei.
[[capabilities]]
name = "code:exec"
hint = ["iw", "ip"]

[placement]
scope = "server"
device_ok = false

# Sorgenti di rete spente: il test resta ermetico e verifica il FONDO della
# catena, cioe' che senza alcuna sorgente si dichiari di non sapere.
# Dati e configurazione in una casa PROPRIA e VUOTA: senza, l'executor legge
# la posizione configurata della macchina vera e il test misura uno stato che
# nessuno ha preparato. Erano tre prove rosse, invisibili perche' i test di
# nascita non li esegue nessuno (scoperte 17/8/2026).
[[tests]]
name     = "nessuna_sorgente_sa_rispondere"
setup    = "rm -rf /tmp/metnos_loc_vuoto && mkdir -p /tmp/metnos_loc_vuoto/data /tmp/metnos_loc_vuoto/config"
teardown = "rm -rf /tmp/metnos_loc_vuoto"
input    = { actor = "test_no_data" }
env      = { METNOS_USER_DATA = "/tmp/metnos_loc_vuoto/data", METNOS_USER_CONFIG = "/tmp/metnos_loc_vuoto/config", METNOS_OWNER_USER_ID = "manifest-location-owner", METNOS_LOCATION_WIFI = "0", METNOS_LOCATION_IP = "0" }
expect   = { ok = false, error_contains = "Nessuna posizione ricevuta per ora. Condividi una posizione su Telegram con il bottone allegati e riprova" }

[[tests]]
name   = "actor_invalido_non_stringa"
input  = { actor = 42 }
expect = { ok = false, error_contains = "deve essere una stringa" }

# Sample concreto di output (one-shot per synt + fast-path generator).
[[tests]]
name        = "happy_path_sample"
setup       = "rm -rf /tmp/metnos_loc_sample && mkdir -p \"$METNOS_USER_DATA\" \"$METNOS_USER_CONFIG\" && printf '%s\\n' '{\"ts\":1778078500.0,\"owner_user_id\":\"manifest-location-owner\",\"actor\":\"test_sample\",\"channel\":\"telegram\",\"lat\":45.4642,\"lon\":9.19,\"accuracy\":12.5}' > \"$METNOS_USER_DATA/locations.jsonl\""
teardown    = "rm -rf /tmp/metnos_loc_sample"
input       = { actor = "test_sample" }
env         = { METNOS_USER_DATA = "/tmp/metnos_loc_sample/data", METNOS_USER_CONFIG = "/tmp/metnos_loc_sample/config", METNOS_OWNER_USER_ID = "manifest-location-owner", METNOS_LOCATION_FRESH_S = "99999999999", METNOS_LOCATION_WIFI = "0", METNOS_LOCATION_IP = "0" }
expect      = { ok = true, has_field = "location" }
expect_full = """
{
  "ok": true,
  "location": {
    "lat": 45.4642,
    "lon": 9.1900,
    "ts": 1778078500.0,
    "source": "shared",
    "accuracy": 12.5,
    "accuracy_m": 12.5,
    "channel": "telegram"
  },
  "age_seconds": 223,
  "actor": "host"
}
"""

# Rideterminazione esplicita: la configurata descrive la MACCHINA, quella
# rilevata descrive dove si trova adesso. Si mostrano entrambe.
[[tests]]
name     = "verifica_confronta_configurata_e_rilevata"
setup    = "rm -rf /tmp/metnos_loc_verify && mkdir -p \"$METNOS_USER_CONFIG\" \"$METNOS_USER_DATA\" && printf '[location]\\nlat = 45.4642\\nlon = 9.19\\nlabel = \"prova\"\\n' > \"$METNOS_USER_CONFIG/location.toml\""
teardown = "rm -rf /tmp/metnos_loc_verify"
input    = { verify = true }
env      = { METNOS_USER_DATA = "/tmp/metnos_loc_verify/data", METNOS_USER_CONFIG = "/tmp/metnos_loc_verify/config", METNOS_LOCATION_WIFI = "0", METNOS_LOCATION_IP = "0" }
expect = { ok = true, error_contains = "" }
