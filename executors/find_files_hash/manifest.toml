manifest_format = "1.0"
executor_standard = "metnos.executor/1.0"

name        = "find_files_hash"
version     = "0.8.0"
timeout_s   = 600
author      = "Roberto Brunialti"
affinity    = [
  "trova", "find", "file duplicati", "immagini duplicate",
  "duplicati", "duplicate", "copie identiche", "contenuto identico",
  "duplicate files", "duplicate images", "hash", "sha256"
]
revertible  = false
lifecycle   = "active"
platforms   = ["linux", "windows"]

[execution]
effect            = "read_only"
parallelism_class = 3
resource_class    = "local_io"
concurrency_key   = "none"
equivalence_gate  = "verified"

# Independent scans do not preserve comparisons across folders. The runtime
# may group one complete comparison by first-level folder without splitting it.
[execution.partition]
arg      = "base_path"
list_arg = "base_paths"
kind     = "directory"
union    = "separate"
sums     = [
  "scanned_files", "visited_dirs", "same_size_candidates", "sampled_files",
  "sample_cache_hits", "full_hash_candidates", "hashed_files", "hash_cache_hits",
  "hashed_bytes", "hash_cache_bytes", "duplicate_groups_count",
  "duplicate_files_count", "redundant_files_count", "redundant_bytes",
]

[description]
it = "SCOPO: trova duplicati esatti; ogni riga una coppia: duplicate_of resta, path è da togliere. PATTERN: find_files_hash(base_path=\"/foto\"); ogni sottocartella da sola: base_paths=[\"/foto/*\"]; più cartelle: [\"/a\",\"/b\"]. NON: find_files prima. OUT: entries=[{partition,path,duplicate_of,mtime,duplicate_of_mtime,size,sha256,group_count}] e conteggi completi; partition con group_by o base_paths; cache per utente."
en = "SCOPO: finds exact duplicates; each row a pair: duplicate_of stays, path is to remove. PATTERN: find_files_hash(base_path=\"/photos\"); each subfolder alone: base_paths=[\"/photos/*\"]; several folders: [\"/a\",\"/b\"]. NON: find_files first. OUT: entries=[{partition,path,duplicate_of,mtime,duplicate_of_mtime,size,sha256,group_count}] and complete counts; partition with group_by or base_paths; per-user cache."

[code]
files  = ["find_files_hash.py"]
digest = "sha256:211325dff27cc9507150bc6adac8c9461b6dadc1d641a3828a0047f704853cf0"

[args]
type     = "object"
required = []
requires_one_of = [["base_path", "base_paths"]]

[args.properties.base_path]
type = "string"

[args.properties.group_by]
type = "string"
pipeline_role = "normalized_literal"
enum = ["first_level"]

[args.properties.group_by.description]
it = "Con first_level confronta tutti i file della radice e delle sottocartelle insieme; attribuisce ogni copia alla cartella di primo livello che la contiene, o alla radice per i file diretti. Non restringe i confronti. Usare per raggruppare risultati e azioni per cartella. Si applica a base_path."
en = "With first_level compares all files in the root and its subfolders together; assigns each copy to its containing first-level folder, or to the root for direct files. Does not narrow comparisons. Use to group results and actions by folder. Applies to base_path."

[args.properties.base_paths]
type = "array"
items = { type = "string" }

[args.properties.base_paths.description]
it = "Più cartelle, ciascuna analizzata per conto suo: i duplicati si cercano dentro ognuna, non fra l'una e l'altra. Una sola cartella seguita da '/*' vale ogni sua sottocartella di primo livello, per esempio ['/server/Immagini/*']; più valori sono cartelle nominate una per una. Ogni riga porta `partition`, la cartella a cui appartiene. Default: nessuna."
en = "Several folders, each analyzed on its own: duplicates are searched inside each one, not across them. A single folder followed by '/*' means each of its first-level subfolders, for example ['/server/Pictures/*']; several values are folders named one by one. Every row carries `partition`, the folder it belongs to. Default: none."

[args.properties.base_path.description]
it = "Directory radice da analizzare, per esempio '/server/Immagini'."
en = "Root directory to analyze, for example '/server/Pictures'."

[args.properties.pattern]
type = "string"

[args.properties.pattern.description]
it = "Uno o più glob separati da virgola o '|', per esempio '*.jpg,*.png'. Se omesso equivale a '*'."
en = "One or more globs separated by comma or '|', for example '*.jpg,*.png'. Omitted means '*'."

[args.properties.patterns]
type = "array"
semantic_type = "file_globs"

[args.properties.patterns.description]
it = "Glob dei nomi file, per esempio ['*.jpg','*.png']; per default ignora le maiuscole. Il runtime li ricava anche da tipi generali come «immagini» o «video»."
en = "Filename globs, for example ['*.jpg','*.png']; case-insensitive by default. The runtime also derives them from broad types such as 'images' or 'video'."

[args.properties.recursive]
type = "boolean"
semantic_type = "directory_recursion"
default = true

[args.properties.recursive.description]
it = "Se true esplora le sottocartelle; se false considera soltanto i file immediati. Default true."
en = "When true, scans subdirectories; when false, considers immediate files only. Default true."

[args.properties.max_depth]
type = "integer"
semantic_type = "directory_max_depth"
minimum = 0
default = 0

[args.properties.max_depth.description]
it = "Profondità massima opzionale della scansione ricorsiva. 0 significa nessun limite ed è il default."
en = "Optional maximum recursive scan depth. 0 means unlimited and is the default."

[args.properties.case_sensitive]
type = "boolean"
default = false

[args.properties.case_sensitive.description]
it = "Se true applica i glob distinguendo maiuscole e minuscole. Default false."
en = "When true, applies globs case-sensitively. Default false."

[args.properties.max_files]
type = "integer"
minimum = 0
default = 0

[args.properties.max_files.description]
it = "Limite opzionale dei file analizzati. 0 significa nessun limite ed è il default; un valore positivo rende esplicita una scansione parziale."
en = "Optional analyzed-file limit. 0 means unlimited and is the default; a positive value explicitly makes the scan partial."

[args.properties.keep]
type = "string"
enum = ["oldest", "newest"]
default = "oldest"
semantic_type = "kept_by_age"

[args.properties.keep.description]
it = "Quale file di ogni gruppo di identici resta, per data di ultima modifica: 'oldest' il più vecchio (default), 'newest' il più recente. Quello che resta è duplicate_of; path elenca gli altri: un passo successivo con from_step cancella o sposta quelli. Per togliere i più recenti: keep='oldest'. Per togliere i più vecchi: keep='newest'."
en = "Which file of each group of identical ones stays, by last-modified date: 'oldest' the oldest (default), 'newest' the most recent. The one that stays is duplicate_of; path lists the others: a later step with from_step deletes or moves those. To remove the most recent ones: keep='oldest'. To remove the oldest ones: keep='newest'."

[args.properties.max_results]
type = "integer"
minimum = 0
default = 500
pipeline_role = "presentation_limit"
complete_value = 0

[args.properties.max_results.description]
it = "Numero massimo di duplicati mostrati, dopo la scansione completa. Default 500; 0 restituisce tutti i duplicati."
en = "Maximum duplicate rows returned after the complete scan. Default 500; 0 returns every duplicate."

[output]
schema_inline = """
{
  ok: bool,
  ok_count: int,
  fail_count: int,
  entries: Array<{partition?: str, path: str, duplicate_of: str, size: int, sha256: str, group_count: int, mtime: float, duplicate_of_mtime: float}>,
  entry_field_roles: Array<{field: str, roles: Array<str>}>,
  failed: Array<{path: str, error_class: str, error_code: str, error: str}>,
  scanned_files: int,
  same_size_candidates: int,
  sampled_files: int,
  sample_cache_hits: int,
  full_hash_candidates: int,
  hashed_files: int,
  hash_cache_hits: int,
  hashed_bytes: int,
  hash_cache_bytes: int,
  hash_workers: int,
  cache_enabled: bool,
  duplicate_groups_count: int,
  duplicate_files_count: int,
  redundant_files_count: int,
  redundant_bytes: int,
  source_complete: bool,
  scan_truncated: bool,
  results_truncated: bool,
  walk_workers: int,
  visited_dirs: int,
  metadata: {
    base_path: str, patterns: Array<str>, recursive: bool,
    case_sensitive: bool, keep: 'oldest' | 'newest'
  },
  authoritative_presentation?: {scope: 'always', text: str, covers_truncation: bool},
  partial?: bool,
  truncated?: bool,
  truncated_what?: str,
  used?: int,
  available_total?: int,
  cap_field?: str,
  cap_value?: int,
  error?: str
}
"""

[presentation]
default_view = "list"

[presentation.list]
mode = "table"
columns = [
  { key = "path", source = "path", cell_max = 240 },
  { key = "duplicate_of", source = "duplicate_of", cell_max = 240 },
  { key = "size", source = "size", cell_max = 24 },
  { key = "group_count", source = "group_count", cell_max = 16 },
]
max_rows = 200
max_chars = 16000
overflow = "notice"
[[capabilities]]
name = "fs:read"
hint = ["arg:base_path"]

[[capabilities]]
name = "metnos:cache"
hint = ["file_hash_cache:local"]

[[tests]]
name = "trova_duplicato_esatto"
setup = "mkdir -p /tmp/metnos_hash_find && printf 'uguale' > /tmp/metnos_hash_find/a.jpg && cp /tmp/metnos_hash_find/a.jpg /tmp/metnos_hash_find/b.jpg"
input = { base_path = "/tmp/metnos_hash_find", patterns = ["*.jpg"] }
expect = { ok = true, field_eq = { scanned_files = 2, duplicate_groups_count = 1, redundant_files_count = 1 } }
env = { METNOS_EXECUTOR_ASSIGNED_WORKERS = "32", METNOS_FIND_HASH_CACHE = "0" }
equivalence_runs = 2
teardown = "rm -rf /tmp/metnos_hash_find"

[[tests]]
name = "stessa_dimensione_non_basta"
setup = "mkdir -p /tmp/metnos_hash_find && printf 'abc' > /tmp/metnos_hash_find/a.bin && printf 'xyz' > /tmp/metnos_hash_find/b.bin"
input = { base_path = "/tmp/metnos_hash_find", patterns = ["*.bin"] }
expect = { ok = true, field_eq = { scanned_files = 2, duplicate_groups_count = 0, redundant_files_count = 0 } }
teardown = "rm -rf /tmp/metnos_hash_find"

[[tests]]
name = "pattern_non_distingue_maiuscole"
setup = "mkdir -p /tmp/metnos_hash_find && printf 'x' > /tmp/metnos_hash_find/A.JPG && cp /tmp/metnos_hash_find/A.JPG /tmp/metnos_hash_find/B.jpg"
input = { base_path = "/tmp/metnos_hash_find", patterns = ["*.jpg"] }
expect = { ok = true, field_eq = { scanned_files = 2, redundant_files_count = 1 } }
teardown = "rm -rf /tmp/metnos_hash_find"

[[tests]]
name = "risultato_vuoto_valido"
setup = "mkdir -p /tmp/metnos_hash_find && printf 'solo' > /tmp/metnos_hash_find/solo.txt"
input = { base_path = "/tmp/metnos_hash_find" }
expect = { ok = true, field_eq = { duplicate_groups_count = 0, redundant_files_count = 0 } }
teardown = "rm -rf /tmp/metnos_hash_find"

[[tests]]
name = "originale_il_piu_vecchio"
setup = "mkdir -p /tmp/metnos_hash_find && printf 'uguale' > /tmp/metnos_hash_find/z_vecchio.jpg && cp /tmp/metnos_hash_find/z_vecchio.jpg /tmp/metnos_hash_find/a_nuovo.jpg && touch -d '2026-01-01 10:00:00' /tmp/metnos_hash_find/z_vecchio.jpg && touch -d '2026-06-01 10:00:00' /tmp/metnos_hash_find/a_nuovo.jpg"
input = { base_path = "/tmp/metnos_hash_find", patterns = ["*.jpg"] }
expect = { ok = true, entries_field_eq = { 0 = { path = "/tmp/metnos_hash_find/a_nuovo.jpg", duplicate_of = "/tmp/metnos_hash_find/z_vecchio.jpg" } } }
env = { METNOS_FIND_HASH_CACHE = "0" }
teardown = "rm -rf /tmp/metnos_hash_find"

[[tests]]
name = "resta_il_piu_recente_a_richiesta"
setup = "mkdir -p /tmp/metnos_hash_find && printf 'uguale' > /tmp/metnos_hash_find/z_vecchio.jpg && cp /tmp/metnos_hash_find/z_vecchio.jpg /tmp/metnos_hash_find/a_nuovo.jpg && touch -d '2026-01-01 10:00:00' /tmp/metnos_hash_find/z_vecchio.jpg && touch -d '2026-06-01 10:00:00' /tmp/metnos_hash_find/a_nuovo.jpg"
input = { base_path = "/tmp/metnos_hash_find", patterns = ["*.jpg"], keep = "newest" }
expect = { ok = true, entries_field_eq = { 0 = { path = "/tmp/metnos_hash_find/z_vecchio.jpg", duplicate_of = "/tmp/metnos_hash_find/a_nuovo.jpg" } } }
env = { METNOS_FIND_HASH_CACHE = "0" }
teardown = "rm -rf /tmp/metnos_hash_find"

[[tests]]
name = "path_assente_fallisce"
input = { base_path = "/tmp/metnos_hash_find_non_esiste" }
expect = { ok = false, field_eq = { error_code = "ERR_PATH_NOT_FOUND" } }

[placement]
scope = "any"
device_ok = true
min_sandbox = "appcontainer"
