# Manifest dell'executor `get_files` — Metnos v1.1
# Naming compositivo: verbo_oggetto_plurale_qualificatore. Vettoriale per costruzione.
# Copre anche le date semantiche EXIF/birth (fields=['dates.semantic']).

manifest_format = "1.0"
executor_standard = "metnos.executor/1.0"

name        = "get_files"
version     = "0.5.0"
author      = "Roberto Brunialti"
# EXIF/geo su molte foto (specie su mount di rete) e' legittimamente lento →
# timeout ampio (il default loader e' 30s, troppo poco). Il worst-case e'
# comunque limitato dal cap `max_results` (§2.11) sotto.
timeout_s   = 180
affinity    = ["file metadata", "metadati file", "file size", "dimensione file", "byte", "file date", "data file", "exif", "foto", "photo", "image", "gps", "geotag", "luogo", "place", "camera", "image_dimensions"]
# W3.2 (executor remoti §16.3): self-contained (solo stdlib + PIL + shim
# messages/executor_helpers, nessuna dipendenza runtime/ non bundlata al
# device), pathlib ovunque, encoding esplicito, nessun comando POSIX.
platforms   = ["linux", "windows"]

[description]
it = "SCOPO: ottiene dimensione, date ed EXIF di file NOTI. PATTERN: get_files(paths=[\"/tmp/a.jpg\"], fields=['size','dates.semantic']). NON: cercare per soggetto -> find_images_indices; per pattern -> find_files. OUT: entries con size_bytes, dates, gps e camera."
en = "SCOPO: gets size, dates, and EXIF for KNOWN files. PATTERN: get_files(paths=[\"/tmp/a.jpg\"], fields=['size','dates.semantic']). NON: search by subject -> find_images_indices; by pattern -> find_files. OUT: entries with size_bytes, dates, GPS, and camera."

[code]
files  = ["get_files.py"]
digest = "sha256:6311a5d260667f304d1b048128f46e391f6fed2bf3746e37e123aa15dbd05fe0"

[args]
type     = "object"
required = []

[args.properties.from_step]
type        = "integer"
minimum     = 1

[args.properties.from_step.description]
it = "Step precedente che ha prodotto i file da arricchire, es. find_files al passo 1 -> from_step=1. Per path letterali usa paths."
en = "Previous step that produced the files to enrich, e.g. find_files at step 1 -> from_step=1. Use paths for literal paths."

[args.properties.paths]
type        = "array"
items       = { type = "string" }

[args.properties.paths.description]
it = "Path letterali esatti, senza glob `*`/`?`; es. ['/tmp/foo.jpg']. Non combinare con `from_step`."
en = "Exact literal paths, without `*`/`?` globs; e.g. ['/tmp/foo.jpg']. Do not combine with `from_step`."

[args.properties.fields]
type        = "array"
items       = { type = "string" }

[args.properties.fields.description]
it = "Metadati: size, dates.semantic/created/modified, gps, place, device, image_dimensions o all. Default ['dates.semantic']."
en = "Metadata: size, dates.semantic/created/modified, gps, place, device, image_dimensions, or all. Default ['dates.semantic']."

[args.properties.max_results]
type        = "integer"

[args.properties.max_results.description]
it = "Numero massimo di file da processare (EXIF/geo sono costosi, spesso su rete). Default 200; 0 = tutti. Oltre il cap il risultato e' troncato con notice (§2.7)."
en = "Max number of files to process (EXIF/geo are costly, often over the network). Default 200; 0 = all. Beyond the cap the result is truncated with a notice (§2.7)."

[[capabilities]]
name = "fs:read"
hint = ["~/**", "/tmp/**"]

[[capabilities]]
name = "network:http"
hint = ["nominatim.openstreetmap.org"]

[output]
schema_inline = "{ ok: bool, entries: array, ok_count: integer, fail_count: integer, truncated?: bool, error?: string }"

[presentation]
default_view = "list"

[presentation.list]
mode = "table"
columns = [
  { key = "item", source = ["id", "name", "title", "subject", "path", "url", "$entry"], cell_max = 240 },
]
max_rows = 200
max_chars = 16000
overflow = "notice"
[[tests]]
name     = "dates_semantic_default"
setup    = "mkdir -p /tmp/metnos_test_meta && echo x > /tmp/metnos_test_meta/a.txt && touch -d '2024-06-15 12:00:00' /tmp/metnos_test_meta/a.txt"
input    = { entries = [{path = "/tmp/metnos_test_meta/a.txt"}] }
expect   = { ok = true, ok_count_eq = 1 }
teardown = "rm -rf /tmp/metnos_test_meta"

[[tests]]
name   = "lista_vuota_ok"
input  = { entries = [] }
expect = { ok = true, ok_count_eq = 0 }

[[tests]]
name   = "fields_invalido_fallisce"
input  = { entries = [], fields = ["pippo"] }
expect = { ok = false, error_contains = "deve essere uno fra" }

[[tests]]
name     = "path_inesistente_fallisce_solo_quella"
input    = { entries = [{path = "/tmp/metnos_does_not_exist_xyz/foo.txt"}] }
expect   = { ok = false, fail_count_eq = 1, error_contains = "non trovato" }

[[tests]]
name   = "args_invalidi_entries_non_lista"
input  = { entries = "/tmp/foo" }
expect = { ok = false, error_contains = "obbligatorio" }

[[tests]]
name   = "fields_all_keyword"
input  = { entries = [], fields = "all" }
expect = { ok = true, ok_count_eq = 0 }

[[tests]]
name   = "cap_max_results_tronca"
input  = { entries = [{path = "/tmp/nope_a.jpg"}, {path = "/tmp/nope_b.jpg"}], max_results = 1, fields = ["size"] }
expect = { ok = false, metadata_field_eq = { truncated = true, used = 1, available_total = 2 } }

[placement]
# F2 (review 2026-07-04): manifest-driven — l'executor puo' girare su
# un device remoto se la chat lo chiede (ADR 0034). Sostituisce la whitelist
# hardcoded DEVICE_ELIGIBLE. scope="any" = server di default, device se nominato.
scope    = "any"
device_ok = true
min_sandbox = "appcontainer"
