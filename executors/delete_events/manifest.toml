# Manifest dell'executor `delete_events` — Metnos v1.1
# Naming compositivo §2.2: azione_oggetto[_qualifier].
# Dispatcher canonical (sequel di create_events, 13/5/2026).

manifest_format = "1.0"

name        = "delete_events"
version     = "0.4.0"
author      = "Roberto Brunialti <roberto.brunialti@metnos.com>"
affinity    = [
    "cancella", "elimina", "delete", "remove", "rimuovi", "appuntamento", "agenda", "evento",
                "calendario", "calendar", "riunione", "incontro", "meeting"
            ]
revertible  = false
lifecycle   = "active"

[description]
it = "Cancella 1+ appuntamenti dal calendario. Dispatcher canonical: instrada al backend giusto in base a `client` (default `local`). USO CORRETTO: delete_events(event_ids=['ev1','ev2']) oppure delete_events(entries={{step1.entries}}) dopo un read_events. Vettoriale §2.1: accetta `event_ids` (plurale), `event_id` (singolare, normalizzato a list len-1), o `entries` (id pescato dal record). NON DEVI usarla per LEGGERE eventi (usa read_events). NON CONFONDERE CON: `delete_tasks` (per CANCELLARE TASK RICORRENTI / TIMER / PROMEMORIA schedulati, NON eventi calendar). §2.6 trasformativo: ritorna `results: list`. §2.3 reversible=false (la cancellazione di un evento esterno non e' undoable senza ricreare la risorsa). Backend `local` (default) e' uno STUB esplicito: ritorna ok=false con error_class='not_implemented' finche' un plugin calendar non viene aggiunto. ERRORE: invocare senza nessuno di event_ids/event_id/entries (manca l'id)."
en = "Deletes 1+ calendar appointments. Canonical dispatcher: routes to the right backend based on `client` (default `local`). CORRECT USE: delete_events(event_ids=['ev1','ev2']) or delete_events(entries={{step1.entries}}) after a read_events. Vectorial §2.1: accepts `event_ids` (plural), `event_id` (singular, normalized to list len-1), or `entries` (id taken from the record). MUST NOT be used to READ events (use read_events). DO NOT CONFUSE WITH: `delete_tasks` (for CANCELING RECURRING TASKS / TIMERS / REMINDERS scheduled in Metnos, NOT calendar events). §2.6 transformative: returns `results: list`. §2.3 reversible=false (deleting an external event is not undoable without recreating the resource). Backend `local` (default) is an explicit STUB: returns ok=false with error_class='not_implemented' until a calendar plugin is added. ERROR: invoking without any of event_ids/event_id/entries (missing id)."

[code]
files  = ["delete_events.py"]
digest = "sha256:a995d8fd51ce0a8e5af216d89cc61744dac77db6d280d32c672ac57604ebe60b"

[args]
type     = "object"
required = []

[args.properties.event_id]
type    = "string"

[args.properties.event_id.description]
it = "Identificatore singolo (forma scalare). Normalizzato internamente a list len-1."
en = "Single identifier (scalar form). Internally normalized to list len-1."

[args.properties.event_ids]
type    = "array"
items   = { type = "string" }

[args.properties.event_ids.description]
it = "Lista di identificatori (vettoriale §2.1: il backend itera la cancellazione)."
en = "List of identifiers (vectorial §2.1: the backend iterates the deletion)."

[args.properties.entries]
type    = "array"
items   = { type = "object" }

[args.properties.entries.description]
it = "Lista di entries da from_step di un produttore (es. read_events): il campo `id` di ognuno alimenta event_ids. Pipeline read -> delete tipica."
en = "List of entries from from_step of a producer (e.g. read_events): the `id` field of each feeds event_ids. Typical read -> delete pipeline."

[args.properties.calendar_id]
type    = "string"
default = "primary"

[args.properties.calendar_id.description]
it = "Identificatore del calendario. Default 'primary'."
en = "Calendar identifier. Default 'primary'."

[args.properties.client]
type        = "string"
enum        = ["local"]
default     = "local"

[args.properties.client.description]
it = "Implementazione backend (default 'local' = calendar locale via ICS file, attualmente stub). Plugin esterni futuri potranno aggiungere altri client."
en = "Backend implementation (default 'local' = local calendar via ICS file, currently stub). Future external plugins may add other clients."

[output]
schema_inline = """
{
  ok: bool,
  results: Array<dict>,
  n_deleted: int,
  used: int,
  partial?: bool,
  failures?: Array<{id, error, error_class}>,
  error?: str,
  error_class?: str
}
"""

[[capabilities]]
name = "metnos:write"
hint = ["~/.local/share/metnos/calendar.ics"]

[[tests]]
name   = "stub_returns_not_implemented"
input  = { event_id = "test-id-1" }
expect = { ok = false, error_contains = "non ancora implementato" }

[[tests]]
name   = "unsupported_client_fails"
input  = { event_id = "x", client = "gdrive" }
expect = { ok = false, error_contains = "unsupported calendar client" }
