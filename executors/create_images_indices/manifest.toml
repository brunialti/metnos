# Manifest dell'executor `create_images_indices` — Metnos (ADR 0117 v4 unified).
# Costruisce/aggiorna l'indice unificato (un solo storage per corpus).

manifest_format = "1.0"
executor_standard = "metnos.executor/1.0"

name        = "create_images_indices"
version     = "0.3.0"
author      = "Roberto Brunialti"
affinity    = ["indicizza", "indicizza foto", "indicizza cartella",
                "build index", "rebuild", "vlm", "qwen", "arcface",
                "embedding", "foto", "image", "photos"]
# §2.3 reversibile via module.reverse(): undo rimuove l'indice SOLO se questo
# turno lo crea ex-novo; un update incrementale non e' ribaltabile (ok_count=0
# onesto §2.8). Nessun reverse_pattern di catalogo → fallback al modulo.
revertible  = true
reverse_pattern = "module.reverse"

[output]
schema_inline = "{ ok: bool, schema_version?: integer, base_path?: string, ok_count?: integer, fail_count?: integer, n_entries_total?: integer, refreshed_count?: integer, last_refresh_at?: number, index_path?: string, index_created?: bool, model_text?: string, model_vlm?: string, model_face?: string, model_image?: string, dim_text?: integer, dim_image?: integer, dry_run?: bool, would_index_count?: integer, n_other_files?: integer, visited_dirs?: integer, walk_workers?: integer, est_time_s?: number, est_size_mb?: number, truncated?: bool, truncated_what?: string, used?: integer, cap_field?: string, cap_value?: integer, warning?: string, error?: string }"

# Build VLM+ArcFace su 30k+ foto puo' richiedere ore: timeout esteso.
timeout_s = 14400

[execution]
effect            = "mutating"
parallelism_class = 3
resource_class    = "local_io"
concurrency_key   = "path"
equivalence_gate  = "verified"

[description]
it = "SCOPO: indicizza foto in `base_path` (incrementale o rebuild). PATTERN: create_images_indices(base_path='~/foto', force=false). NON: idx='scene' (deprecated); `find_files` (filesystem, no indice). OUT: {ok,schema_version,ok_count,fail_count,base_path,n_entries_total,refreshed_count,last_refresh_at,index_path,model_text,model_vlm,model_face}."
en = "SCOPO: index photos in `base_path` (incremental or rebuild). PATTERN: create_images_indices(base_path='~/photos', force=false). NON: idx='scene' (deprecated); `find_files` (filesystem, no index). OUT: {ok,schema_version,ok_count,fail_count,base_path,n_entries_total,refreshed_count,last_refresh_at,index_path,model_text,model_vlm,model_face}."

[code]
files  = ["create_images_indices.py"]
digest = "sha256:3b128c8d4b3933cd8f2b91d451c6781ff342a1c31cae75aa047c73da298bbab7"

[args]
type     = "object"
required = ["base_path"]

[args.properties.base_path]
type        = "string"

[args.properties.base_path.description]
it = "Directory radice della collezione di foto. Path assoluto o ~ espandibile."
en = "Root directory of the photo collection. Absolute path or expandable ~."

[args.properties.recursive]
type        = "boolean"
default     = true

[args.properties.recursive.description]
it = "Se true (default), visita in parallelo anche le sottocartelle e indicizza le immagini trovate."
en = "If true (default), walk subdirectories in parallel and index the images found."

[args.properties.force]
type        = "boolean"
default     = false

[args.properties.force.description]
it = "Se true, rebuild totale (ignora indice esistente). Default false: refresh incrementale (skip foto invariate)."
en = "If true, total rebuild (ignores existing index). Default false: incremental refresh (skip unchanged photos)."

[args.properties.max_files]
type        = "integer"
minimum     = 1
default     = 50000

[args.properties.max_files.description]
it = "Tetto massimo di file da indicizzare nella singola call. Default 50000."
en = "Maximum number of files to index in a single call. Default 50000."

[args.properties.dry_run]
type        = "boolean"
default     = false

[args.properties.dry_run.description]
it = "Se true, conta i file e stima costo/spazio senza scrivere nulla."
en = "If true, counts files and estimates cost/space without writing anything."

[args.properties.idx]
type        = "string"

[args.properties.idx.description]
it = "DEPRECATED post-ADR0117. Ignorato con warn log. NON USARE."
en = "DEPRECATED post-ADR0117. Ignored with warn log. DO NOT USE."

[[capabilities]]
name = "fs:read"
hint = ["~/**", "/mnt/**", "/tmp/**"]

[[capabilities]]
name = "fs:write"
hint = ["~/.local/share/metnos/index/image/**"]

[[tests]]
name     = "base_path_inesistente_fallisce"
input    = { base_path = "/tmp/metnos_does_not_exist_xyz_unified_create" }
expect   = { ok = false, error_contains = "Percorso non trovato" }

[[tests]]
name     = "missing_base_path_fallisce"
input    = { recursive = true }
expect   = { ok = false, error_contains = "base_path" }

[[tests]]
name     = "dry_run_ricorsivo_equivalente"
setup    = "mkdir -p /tmp/metnos_image_walk_test/sub && printf x > /tmp/metnos_image_walk_test/a.jpg && printf y > /tmp/metnos_image_walk_test/sub/b.png"
input    = { base_path = "/tmp/metnos_image_walk_test", recursive = true, dry_run = true }
expect   = { ok = true, field_eq = { would_index_count = 2 } }
env      = { METNOS_EXECUTOR_ASSIGNED_WORKERS = "32" }
equivalence_runs = 2
teardown = "rm -rf /tmp/metnos_image_walk_test"
