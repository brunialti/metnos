# Public image-index requests expand into resumable LRE units.
manifest_format = "1.0"
executor_standard = "metnos.executor/1.0"
name = "create_images_indices"
version = "0.4.0"
timeout_s = 14400
intelligence = "llm"
author = "Roberto Brunialti"
lifecycle = "active"
lre_plan = "images.index.v1"
affinity = ["indicizza", "indicizza foto", "indicizza cartella", "build index", "rebuild", "vlm", "embedding", "foto", "image", "photos"]
revertible = false

[execution]
effect = "mutating"
parallelism_class = 3
resource_class = "local_io"
concurrency_key = "path"
equivalence_gate = "verified"

[description]
it = "SCOPO: costruisce o aggiorna l'indice delle foto con unità LRE riprendibili; la generazione precedente resta leggibile fino alla pubblicazione completa. PATTERN: create_images_indices(base_path='~/foto', force=false). NON: ricerca di foto o lettura di file. OUT: ricevuta LRE; al completamento n_entries_total e index_path."
en = "SCOPO: builds or refreshes the photo index through resumable LRE units; the previous generation remains readable until complete publication. PATTERN: create_images_indices(base_path='~/photos', force=false). NON: photo searches or file reading. OUT: LRE receipt; on completion n_entries_total and index_path."

[code]
files = ["create_images_indices.py"]
digest = "sha256:37ecb38bf6089379e22528026ad3d10286bd0bc039c6f317b1f42662c672e1f5"

[args]
type = "object"
required = ["base_path"]

[args.properties.base_path]
type = "string"
[args.properties.base_path.description]
it = "Directory radice della collezione. Il runtime ne congela il percorso prima di avviare LRE."
en = "Collection root directory. The runtime freezes its path before starting LRE."

[args.properties.recursive]
type = "boolean"
default = true
[args.properties.recursive.description]
it = "Include le sottocartelle nella scoperta dei file."
en = "Include subdirectories when discovering files."

[args.properties.force]
type = "boolean"
default = false
[args.properties.force.description]
it = "Rianalizza tutte le foto; altrimenti riusa solo risultati completi con contenuto verificato identico."
en = "Analyze every photo again; otherwise reuse only complete results with verified identical content."

[args.properties.max_files]
type = "integer"
minimum = 1
maximum = 1000000
default = 50000
[args.properties.max_files.description]
it = "Limite esplicito delle immagini ammesse. Se superato, il lavoro si interrompe senza pubblicare un indice incompleto."
en = "Explicit admitted-image limit. Exceeding it stops the build without publishing an incomplete index."

[args.properties.dry_run]
type = "boolean"
default = false
[args.properties.dry_run.description]
it = "Conta le immagini senza analizzarle, avviare LRE o scrivere indici."
en = "Count images without analyzing them, starting LRE or writing indexes."

[args.properties.idx]
type = "string"
[args.properties.idx.description]
it = "Parametro storico ignorato: esiste un solo indice immagini unificato."
en = "Ignored legacy parameter: there is only one unified image index."

[args.properties.phase]
type = "string"
enum = ["discover", "analyze", "merge", "publish"]
[args.properties.phase.description]
it = "Campo tecnico riservato alle unità ammesse da LRE; non impostarlo nella richiesta pubblica."
en = "Technical field reserved for admitted LRE units; do not set it in public requests."

[args.properties.generation]
type = "string"
pattern = "^[A-Za-z0-9_-]{1,128}$"
[args.properties.generation.description]
it = "Identificativo opaco della generazione, congelato da LRE."
en = "Opaque generation identifier frozen by LRE."

[args.properties.entries]
type = "array"
items = {type = "object"}
[args.properties.entries.description]
it = "Ricevute di frammenti accettati e contesti cartella, forniti esclusivamente dalle dipendenze LRE."
en = "Accepted fragment receipts and folder contexts supplied exclusively by LRE dependencies."

[args.properties.expected_count]
type = "integer"
minimum = 0
maximum = 1000000
[args.properties.expected_count.description]
it = "Numero delle sorgenti sigillate; la pubblicazione richiede copertura esatta."
en = "Sealed source count; publication requires exact coverage."

[args.properties.device_id]
type = "string"
[args.properties.device_id.description]
it = "Identità tecnica del dispositivo sorgente, congelata da LRE."
en = "Technical source-device identity frozen by LRE."

[args.properties.max_total_bytes]
type = "integer"
minimum = 0
maximum = 1099511627776
default = 1099511627776
[args.properties.max_total_bytes.description]
it = "Limite totale esplicito dei byte sorgente ammessi, congelato da LRE."
en = "Explicit total admitted-source byte limit frozen by LRE."

[args.properties.max_depth]
type = "integer"
minimum = 0
maximum = 64
default = 64
[args.properties.max_depth.description]
it = "Profondità massima della scoperta, congelata da LRE."
en = "Maximum discovery depth frozen by LRE."

[[capabilities]]
name = "fs:read"
hint = ["arg:base_path"]

[[capabilities]]
name = "metnos:cache"
hint = ["image_index:local"]

[[capabilities]]
name = "metnos:read"
hint = ["embedding_text:local", "embedding_image:local", "embedding_face:local"]
when = {arg = "phase", values = ["analyze"]}

[[capabilities]]
name = "llm:local"
hint = ["bounded_image_index_analysis"]
when = {arg = "phase", values = ["analyze"]}

[[capabilities]]
name = "network:http"
hint = ["127.0.0.1"]
when = {arg = "phase", values = ["analyze"]}

[output]
schema_inline = "{ ok: bool, entries: array, source_count?: integer, inventory_digest?: string, schema_version?: integer, base_path?: string, ok_count?: integer, fail_count?: integer, n_entries_total?: integer, refreshed_count?: integer, last_refresh_at?: number, index_path?: string, index_created?: bool, active_generation?: string, root_part?: string, n_entries?: integer, n_faces?: integer, n_images_with_visual_emb?: integer, version?: integer, model_text?: string, model_vlm?: string, model_face?: string, model_image?: string, dim_text?: integer, dim_image?: integer, dry_run?: bool, would_index_count?: integer, n_other_files?: integer, visited_dirs?: integer, walk_workers?: integer, error?: string, error_class?: string, error_code?: string }"

# Worker entries are opaque artifact receipts, never image-gallery results.
# Public requests present the LRE status; this list is for receipt inspection.
[presentation]
default_view = "list"

[presentation.list]
mode = "table"
columns = [{key = "id", source = "part", cell_max = 64}]
max_rows = 32
max_chars = 4096
overflow = "notice"

[[tests]]
name = "missing_base_path_fails"
input = {recursive = true}
expect = {ok = false, error_contains = "base_path"}

[[tests]]
name = "recursive_dry_run_equivalence"
setup = "mkdir -p /tmp/metnos_image_walk_test/sub && printf x > /tmp/metnos_image_walk_test/a.jpg && printf y > /tmp/metnos_image_walk_test/sub/b.png"
input = {base_path = "/tmp/metnos_image_walk_test", recursive = true, dry_run = true}
expect = {ok = true, field_eq = {would_index_count = 2}}
env = {METNOS_EXECUTOR_ASSIGNED_WORKERS = "32"}
equivalence_runs = 2
teardown = "rm -rf /tmp/metnos_image_walk_test"
