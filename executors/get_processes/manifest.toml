# get_processes — snapshot processi + opzionale health (load/memory/
# thermal/disk/network/services). Handcrafted 3/5/2026 dalla fusione
# di get_processes+list_processes. Predicati lato ps/proc, no post-filter.

manifest_format = "1.0"
executor_standard = "metnos.executor/1.0"

name        = "get_processes"
version     = "0.3.1"
platforms   = ["linux", "windows"]
author      = "Roberto Brunialti"
affinity    = ["processi", "ps", "stato server", "server status",
                "salute sistema", "system health", "uptime",
                "carico", "load", "cpu", "ram", "situazione",
                "diagnostica", "temperatura", "temperature",
                "thermal", "calore", "gpu", "disco", "memoria",
                "free", "df", "top"]
revertible  = false
lifecycle   = "active"

[description]
it = "SCOPO: processi e salute del sistema. PATTERN: temperatura CPU: sensor_domains=[\"cpu\"] con sensor_types=[\"temperature\"]; stato: include_health=true. NON: task -> list_tasks; file -> get_files; ora/posizione -> get_now/get_location. OUT: entries e health attestato."
en = "SCOPO: processes and system health. PATTERN: CPU temperature: sensor_domains=[\"cpu\"] with sensor_types=[\"temperature\"]; status: include_health=true. NON: tasks -> list_tasks; files -> get_files; time/location -> get_now/get_location. OUT: attested entries and health."

[code]
files  = ["get_processes.py"]
digest = "sha256:e24233c8a21b01d31d91f31b36c0b89c61ce2e4a9ca70ea00edc460d4c8f3d9f"

[args]
type     = "object"

[args.properties.filters]
type        = "array"
default     = []

[args.properties.filters.description]
it = """Predicati `{attribute,op?,value}` in AND. Default [].
attribute ∈ {pid,ppid,name,cmd,user,cpu_pct,mem_pct,started_at}.
op ∈ {=,!=,>,>=,<,<=,contains,startswith,endswith,regex,in} (default =).
OK: [{attribute:"name",op:"contains",value:"python"}]."""
en = """Predicates `{attribute,op?,value}` in AND. Default [].
attribute ∈ {pid,ppid,name,cmd,user,cpu_pct,mem_pct,started_at}.
op ∈ {=,!=,>,>=,<,<=,contains,startswith,endswith,regex,in} (default =).
OK: [{attribute:"name",op:"contains",value:"python"}]."""

[args.properties.top]
type        = "integer"
minimum     = 1

[args.properties.top.description]
it = """int≥1, ordina per cpu_pct desc. Omesso → tutti.
NON DEVI usare max_results/limit/n/count."""
en = """int≥1, ordered by cpu_pct desc. Omitted → all.
MUST NOT use max_results/limit/n/count."""

[args.properties.include_health]
type        = "boolean"
default     = false

[args.properties.include_health.description]
it = """bool. Se true aggiunge dict health.{load,memory,thermal,disk,network,services}.
USO: stato/salute/uptime/carico/IP/rete/temperatura del server.
Su Windows sensor_domains+sensor_types abilitano selettivamente il provider registrato; WMI e zone ACPI restano ripieghi locali per la temperatura. Una zona ACPI non viene presentata come temperatura CPU.
NON DEVI usare health/with_health/system/status."""
en = """bool. If true adds dict health.{load,memory,thermal,disk,network,services}.
USE: status/health/uptime/load/IP/network/temperature of server.
On Windows, sensor_domains+sensor_types selectively enable the registered provider; WMI and ACPI zones remain local temperature fallbacks. An ACPI zone is never presented as an attested CPU temperature.
MUST NOT use health/with_health/system/status."""

[args.properties.sensor_domains]
type        = "array"
default     = []
uniqueItems = true
maxItems    = 10
items = { type = "string", enum = ["cpu", "gpu", "storage", "motherboard", "controller", "memory", "network", "battery", "power_supply", "power_monitor"] }

[args.properties.sensor_domains.description]
it = "Domini hardware richiesti. Usa soltanto quelli necessari: CPU=[\"cpu\"], GPU=[\"gpu\"], disco/NVMe=[\"storage\"]. Richiede anche sensor_types."
en = "Requested hardware domains. Use only those required: CPU=[\"cpu\"], GPU=[\"gpu\"], disk/NVMe=[\"storage\"]. Also requires sensor_types."

[args.properties.sensor_types]
type        = "array"
default     = []
uniqueItems = true
maxItems    = 16
items = { type = "string", enum = ["temperature", "fan", "voltage", "current", "power", "clock", "load", "frequency", "flow", "control", "level", "factor", "data", "small_data", "throughput", "time_span", "timing", "energy", "noise", "conductivity", "humidity"] }

[args.properties.sensor_types.description]
it = "Misure hardware richieste, abbinate a sensor_domains. Esempi: [\"temperature\"], [\"fan\"], [\"clock\",\"load\"]. Nessuna scansione completa implicita."
en = "Requested hardware measurements, paired with sensor_domains. Examples: [\"temperature\"], [\"fan\"], [\"clock\",\"load\"]. No implicit full scan."

[args.properties.services_extra]
type        = "array"
default     = []

[args.properties.services_extra.description]
it = """Lista systemd --user unit aggiuntive in health.services. Default [].
Solo se include_health=true. OK: ["llama-server","headscaled"]."""
en = """List of extra systemd --user units in health.services. Default [].
Only if include_health=true. OK: ["llama-server","headscaled"]."""

[args.properties.scheduler_health]
type            = "object"
runtime_resolved = true
runtime_source   = "scheduler_health"

[args.properties.scheduler_health.description]
it = "Solo runtime: stato attestato del loop scheduler co-ospitato dal server HTTP. Il planner non può valorizzarlo e non viene inviato ai dispositivi remoti."
en = "Runtime only: attested state of the scheduler loop co-hosted by the HTTP server. The planner cannot set it, and it is not sent to remote devices."

[output]
# Shape del dict ritornato da invoke(). Sintassi TS-like: tipi base
# {bool,int,float,str}, container Array<...>, opzionali con `?`,
# unione con `|`, null esplicito. Sorgente di verita' per template
# fast-path e validatori. Niente prosa.
schema_inline = """
{
  ok: bool, ok_count: int, fail_count: int,
  entries: Array<{pid:int, ppid:int, name:str, cmd:str, user:str, cpu_pct:float, mem_pct:float, started_at:str}>,
  failed?: Array<{error:str}>,
  truncated: bool, truncated_what: str|null, truncated_intentional: bool,
  used: int, available_total: int, cap_field: str|null, cap_value: int|null,
  partial?: bool, error?: str, error_code?: str, error_class?: str,
  managed_dependency?: str,
  health?: {
    load: {available:bool, "1m":float, "5m":float, "15m":float, uptime_s:int, reason?:str},
    memory: {available:bool, total_mb:int, used_mb:int, free_mb:int, pct:float, swap_total_mb:int, swap_used_mb:int, swap_pct:float, reason?:str},
    thermal: {available:bool, source?:str, quality?:str, reason_code?:str, cpu_c?:float, gpu_c?:float, nvme_c?:float, sensors?:Array<{kind:str, name:str, identifier:str, value_c:float}>},
    hardware_sensors?: {available:bool, source:str, reason_code?:str, sensors:Array<{domain:str, kind:str, name:str, identifier:str, value:float, unit:str}>},
    disk: Array<{mount:str, device:str, fstype:str, total_gb:float, used_gb:float, free_gb:float, pct:float}>,
    network: Array<{iface:str, ipv4:Array<str>, ipv6:Array<str>, up:bool}>,
    services: Array<{name:str, status:str, key?:str, scope?:str, installed?:bool, healthy?:bool, reason_code?:str, cohost?:str, heartbeat_at?:str, heartbeat_age_s?:float|null, jobs_total?:int, jobs_enabled?:int, jobs_running?:int, last_run_at?:str, last_run_status?:str, error_class?:str, error_summary?:str, active_since_s_mono?:int}>,
    collected_at: int
  }
}
"""

[[managed_dependencies]]
key        = "hardware_sensor_provider"
package_id = "LibreHardwareMonitor.LibreHardwareMonitor"
mode       = "provider"
interface  = "hardware_sensors_v1"
domains_arg = "sensor_domains"
sensor_types_arg = "sensor_types"
assembly   = "LibreHardwareMonitorLib.dll"
entry_type = "LibreHardwareMonitor.Hardware.Computer"

[presentation]
default_view = "list"

[presentation.list]
mode = "table"
columns = [
  { key = "pid", source = "pid", cell_max = 16 },
  { key = "name", source = "name", cell_max = 100 },
  { key = "user", source = "user", cell_max = 80 },
  { key = "cpu_pct", source = "cpu_pct", cell_max = 16 },
  { key = "mem_pct", source = "mem_pct", cell_max = 16 },
]
max_rows = 200
max_chars = 16000
overflow = "notice"
[[capabilities]]
name = "system:read"
hint = ["processes", "health", "network_interfaces", "service_status"]

# Implementazione: ps/systemctl e, su Windows, PowerShell+CIM. La capability
# forza il Job Object sul client Windows: WMI/RPC non funziona in AppContainer.
[[capabilities]]
name = "code:exec"
hint = ["ps", "systemctl", "powershell", "WMI/CIM", "nvidia-smi", "rocm-smi"]

[[tests]]
name   = "no_filters_returns_all"
input  = {}
expect = { ok = true, has_field = "entries", entries_min = 1 }

[[tests]]
name   = "filter_by_name_contains"
input  = { filters = [{ attribute = "name", op = "contains", value = "python" }] }
expect = { ok = true, has_field = "entries" }

[[tests]]
name   = "top_3_by_cpu"
input  = { top = 3 }
expect = { ok = true, has_field = "entries", entries_max = 3 }

[[tests]]
name   = "single_pid_degenerate"
input  = { filters = [{ attribute = "pid", op = "=", value = 1 }] }
expect = { ok = true, has_field = "entries", entries_max = 1 }

[[tests]]
name   = "include_health_adds_top_level_dict"
input  = { include_health = true, top = 5 }
expect = { ok = true, has_field = "health" }

# Sample one-shot per synt + fast-path generator. Tutti i campi
# health rappresentati (load/memory/thermal/disk/network/services).
[[tests]]
name        = "happy_path_with_health_sample"
input       = { include_health = true, top = 2 }
expect      = { ok = true, has_field = "health", entries_max = 2 }
expect_full = """
{
  "ok": true, "ok_count": 2, "fail_count": 0,
  "entries": [
    {"pid": 1234, "ppid": 1, "name": "python", "cmd": "/usr/bin/python3", "user": "roberto", "cpu_pct": 50.0, "mem_pct": 1.2, "started_at": "01:23:45"},
    {"pid": 5678, "ppid": 1, "name": "llama-server", "cmd": "/opt/.../llama-server", "user": "roberto", "cpu_pct": 7.7, "mem_pct": 7.6, "started_at": "12-04:55:22"}
  ],
  "truncated": true, "truncated_what": "process", "truncated_intentional": true,
  "used": 2, "available_total": 489, "cap_field": "top", "cap_value": 2,
  "health": {
    "load": {"available": true, "1m": 0.43, "5m": 0.32, "15m": 0.25, "uptime_s": 520355},
    "memory": {"available": true, "total_mb": 124410, "used_mb": 45650, "pct": 36.7, "swap_total_mb": 8192, "swap_used_mb": 0, "swap_pct": 0.0},
    "thermal": {"available": true, "cpu_c": 49, "gpu_c": 46, "nvme_c": 37},
    "disk": [{"mount": "/", "device": "/dev/nvme0n1p2", "fstype": "ext4", "total_gb": 850.0, "used_gb": 223.5, "free_gb": 626.5, "pct": 26.3}],
    "network": [{"iface": "eth0", "ipv4": ["192.0.2.10"], "ipv6": ["2001:db8::1"], "up": true}],
    "services": [{"name": "metnos-http", "status": "active"}],
    "collected_at": 1778077408
  }
}
"""

[placement]
# C7 Area-2 estensione (5/7 sera): read-only fs-puro, chiusura già nello shim.
# scope="any" = server di default; device SOLO se la chat lo nomina.
scope    = "any"
device_ok = true
min_sandbox = "job-object"
