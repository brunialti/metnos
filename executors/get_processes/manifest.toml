# Manifest dell'executor `get_processes` — Metnos v1.1
# Promosso a handcrafted 3/5/2026 dalla fusione di due synth (`get_processes`
# e `list_processes`) che facevano cose diverse con nomi sovrapposti.
# Una sola funzione: prende lo snapshot dei processi del sistema; se
# `filters` e' vuoto/omesso ritorna tutti, altrimenti applica i predicati
# alla query (lato `ps`/`/proc`, non lato post-filtraggio in memoria).

manifest_format = "1.0"

name        = "get_processes"
version     = "0.2.0"
author      = "Roberto Brunialti <roberto.brunialti@metnos.com>"
affinity    = ["processi", "process", "task", "ps",
                "stato server", "server status", "salute sistema",
                "system health", "uptime", "carico", "load",
                "cpu", "memory", "ram"]
revertible  = false
lifecycle   = "active"

[description]
it = """Snapshot dei processi correnti (lista) e, opzionalmente, salute aggregata del server (dict `health`).

USO CORRETTO: query "processi/task/ps" → senza flag. Query "stato server / salute / uptime / carico" → DEVI passare `include_health=true`.
NON CONFONDERE CON: `get_files_metadata` (file su disco), `get_now` (data/ora), `get_location` (posizione fisica utente).

ARG NAMES (nomi esatti, niente sinonimi):
DEVI: `top` per limitare il numero di processi (intero ≥ 1).
NON DEVI: `max_results`, `limit`, `n`, `count`. NON ESISTONO. E' UN ERRORE.
DEVI: `include_health=true` per ottenere la sezione salute.
NON DEVI: `health=true`, `with_health`, `system`, `status=true`. NON ESISTONO. E' UN ERRORE.

DEFAULT: `filters=[]`, `top` omesso → tutti, `include_health=false`, `services_extra=[]`.

OUTPUT (sempre): `{ok, entries=[{pid, ppid, name, cmd, user, cpu_pct, mem_pct, started_at}], ok_count, truncated, available_total}`.
OUTPUT (con `include_health=true`): aggiunge top-level `health = {load:{1m,5m,15m,uptime_s}, memory:{total_mb,used_mb,pct,swap_total_mb,swap_used_mb}, disk:[{mount,fstype,total_gb,used_gb,pct}], services:[{name,status}], collected_at}`.

PATTERN (non copiare letteralmente: sostituisci con i termini della query utente):
"processi" → `get_processes()`.
"i 5 più CPU-hungry" → `get_processes(top=5)`.
"stato del server" → `get_processes(include_health=true, top=10)`.
"uptime" / "salute sistema" → `get_processes(include_health=true)`.
"processi nginx" → `get_processes(filters=[{attribute:"name", op:"contains", value:"nginx"}])`.
"PID 1234" → `get_processes(filters=[{attribute:"pid", op:"=", value:1234}])`."""
en = "Snapshot of current processes (list) and, optionally, aggregate server health (dict `health`).  CORRECT USE: query \"processes/task/ps\" → without flag. Query \"server status / health / uptime / load\" → MUST pass `include_health=true`. DO NOT CONFUSE WITH: `get_files_metadata` (files on disk), `get_now` (date/time), `get_location` (user physical location).  ARG NAMES (exact names, no synonyms): MUST: `top` to limit the number of processes (integer ≥ 1). MUST NOT: `max_results`, `limit`, `n`, `count`. THEY DO NOT EXIST. THIS IS AN ERROR. MUST: `include_health=true` to obtain the health section. MUST NOT: `health=true`, `with_health`, `system`, `status=true`. THEY DO NOT EXIST. THIS IS AN ERROR.  DEFAULT: `filters=[]`, `top` omitted → all, `include_health=false`, `services_extra=[]`.  OUTPUT (always): `{ok, entries=[{pid, ppid, name, cmd, user, cpu_pct, mem_pct, started_at}], ok_count, truncated, available_total}`. OUTPUT (with `include_health=true`): adds top-level `health = {load:{1m,5m,15m,uptime_s}, memory:{total_mb,used_mb,pct,swap_total_mb,swap_used_mb}, disk:[{mount,fstype,total_gb,used_gb,pct}], services:[{name,status}], collected_at}`.  PATTERN (do not copy literally: replace with the user query terms): \"processes\" → `get_processes()`. \"the 5 most CPU-hungry\" → `get_processes(top=5)`. \"server status\" → `get_processes(include_health=true, top=10)`. \"uptime\" / \"system health\" → `get_processes(include_health=true)`. \"nginx processes\" → `get_processes(filters=[{attribute:\"name\", op:\"contains\", value:\"nginx\"}])`. \"PID 1234\" → `get_processes(filters=[{attribute:\"pid\", op:\"=\", value:1234}])`."

[code]
files  = ["get_processes.py"]
digest = "sha256:a2cd5b25c3a6a81bfc0e77d302cc356a91876fab9eb108191a68ba067fdb833d"

[args]
type     = "object"

[args.properties.filters]
type        = "array"
default     = []

[args.properties.filters.description]
it = """Lista di predicati `{attribute, op?, value}` applicati in AND. Default: [] (tutti i processi).
`attribute` ∈ {pid, ppid, name, cmd, user, cpu_pct, mem_pct, started_at}.
`op` ∈ {'=', '!=', '>', '>=', '<', '<=', 'contains', 'startswith', 'endswith', 'regex', 'in'} (default '=').
Esempio: [{attribute:"name", op:"contains", value:"python"}]."""
en = "List of predicates `{attribute, op?, value}` applied in AND. Default: [] (all processes). `attribute` ∈ {pid, ppid, name, cmd, user, cpu_pct, mem_pct, started_at}. `op` ∈ {'=', '!=', '>', '>=', '<', '<=', 'contains', 'startswith', 'endswith', 'regex', 'in'} (default '='). Example: [{attribute:\"name\", op:\"contains\", value:\"python\"}]."

[args.properties.top]
type        = "integer"
minimum     = 1

[args.properties.top.description]
it = """Numero massimo di processi (intero ≥ 1, ordinati per cpu_pct desc). Default: omesso → tutti.
DEVI usare il nome esatto `top`. NON DEVI usare `max_results`, `limit`, `n`, `count` (non esistono).
Esempio: top=5."""
en = "Maximum number of processes (integer ≥ 1, ordered by cpu_pct desc). Default: omitted → all. MUST use the exact name `top`. MUST NOT use `max_results`, `limit`, `n`, `count` (they do not exist). Example: top=5."

[args.properties.include_health]
type        = "boolean"
default     = false

[args.properties.include_health.description]
it = """Bool. Se true, aggiunge dict `health` (load/memory/disk/services). Default: false.
USO: query "stato server / salute sistema / uptime / carico / system status".
DEVI usare il nome esatto `include_health`. NON DEVI usare `health`, `with_health`, `system`, `status` (non esistono).
Esempio: include_health=true."""
en = "Bool. If true, adds dict `health` (load/memory/disk/services). Default: false. USE: query \"server status / system health / uptime / load / system status\". MUST use the exact name `include_health`. MUST NOT use `health`, `with_health`, `system`, `status` (they do not exist). Example: include_health=true."

[args.properties.services_extra]
type        = "array"
default     = []

[args.properties.services_extra.description]
it = """Lista opzionale di nomi di unit systemd --user da aggiungere a `health.services`. Default: [].
Solo letti se `include_health=true`. Niente effetto altrimenti.
Esempio: services_extra=["llama-server", "headscaled"]."""
en = "Optional list of systemd --user unit names to add to `health.services`. Default: []. Only read if `include_health=true`. No effect otherwise. Example: services_extra=[\"llama-server\", \"headscaled\"]."

[output]
# Shape del dict ritornato da invoke(). Sintassi TS-like: tipi base
# {bool,int,float,str}, container Array<...>, opzionali con `?`,
# unione con `|`, null esplicito. Sorgente di verita' per template
# fast-path e validatori. Niente prosa.
schema_inline = """
{
  ok: bool,
  ok_count: int,
  fail_count: int,
  entries: Array<{
    pid: int, ppid: int, name: str, cmd: str, user: str,
    cpu_pct: float, mem_pct: float, started_at: str
  }>,
  failed?: Array<{error: str}>,
  truncated: bool,
  truncated_what: str | null,
  truncated_intentional: bool,
  used: int,
  available_total: int,
  cap_field: str | null,
  cap_value: int | null,
  health?: {
    load: {
      available: bool, "1m": float, "5m": float, "15m": float,
      uptime_s: int, reason?: str
    },
    memory: {
      available: bool, total_mb: int, used_mb: int, free_mb: int,
      pct: float, swap_total_mb: int, swap_used_mb: int, swap_pct: float,
      reason?: str
    },
    disk: Array<{
      mount: str, device: str, fstype: str,
      total_gb: float, used_gb: float, free_gb: float, pct: float
    }>,
    services: Array<{
      name: str, status: str, active_since_s_mono?: int
    }>,
    collected_at: int
  }
}
"""

[[capabilities]]
name = "code:exec"
hint = ["ps", "/proc"]

[[tests]]
name   = "no_filters_returns_all"
input  = {}
expect = { ok = true, has_field = "entries", entries_min = 5 }

[[tests]]
name   = "filter_by_name_contains"
input  = { filters = [{ attribute = "name", op = "contains", value = "python" }] }
expect = { ok = true, has_field = "entries" }

[[tests]]
name   = "top_3_by_cpu"
input  = { top = 3 }
expect = { ok = true, has_field = "entries", entries_max = 3 }

[[tests]]
name   = "single_pid_degenerate"
input  = { filters = [{ attribute = "pid", op = "=", value = 1 }] }
expect = { ok = true, has_field = "entries", entries_max = 1 }

[[tests]]
name   = "include_health_adds_top_level_dict"
input  = { include_health = true, top = 5 }
expect = { ok = true, has_field = "health" }

# Sample concreto di output (one-shot per synt + fast-path generator).
