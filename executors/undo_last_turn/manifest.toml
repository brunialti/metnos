# Manifest dell'executor `undo_last_turn` — Metnos v1.1
# Annulla le operazioni revertibili dell'ultimo turno utente.

manifest_format = "1.0"
executor_standard = "metnos.executor/1.0"

name        = "undo_last_turn"
version     = "0.3.0"
platforms   = ["linux"]
revertible  = false
lifecycle   = "active"
author      = "Roberto Brunialti"
affinity    = ["undo", "annulla", "ripristina", "revert", "rollback", "torna", "indietro", "ribalta"]

[description]
it = "SCOPO: annulla le operazioni reversibili dell'ultimo turno utente. PATTERN: undo_last_turn(). NON: operazioni irreversibili (saltate); chiamate consecutive (idempotente). OUT: {undone_count, skipped_count, details, turn_id?}."
en = "SCOPO: cancel all reversible operations of the last user turn. PATTERN: undo_last_turn(). NON: irreversible operations (skipped); consecutive calls (idempotent). OUT: {undone_count, skipped_count, details, turn_id?}."

[code]
files  = ["undo_last_turn.py"]
digest = "sha256:cbb559081873b4e960baaa9d56940a10f5f82aaf348450a6bba542c5ed765d6c"

[args]
type     = "object"

[args.properties.log_path]
type        = "string"
runtime_resolved = true

[args.properties.log_path.description]
it = "Solo runtime/test diretto: path del journal undo. Il choke-point usa sempre il journal canonico e ignora valori proposti."
en = "Runtime/direct-test only: undo journal path. The choke point always uses the canonical journal and ignores proposed values."

[args.properties._actor]
type = "string"
runtime_resolved = true

[args.properties._actor.description]
it = "Solo runtime: identità autenticata del proprietario del turno da annullare; eventuali valori proposti dal modello vengono ignorati."
en = "Runtime only: authenticated identity owning the turn to undo; any model-proposed value is ignored."

[output]
schema_inline = """
{
  ok: bool,
  undone_count: int,
  skipped_count: int,
  details: Array<object>,
  turn_id?: str,
  message?: str,
  error?: str, error_class?: str, error_code?: str
}
"""

[[capabilities]]
name = "system:undo"
hint = ["latest_owned_turn"]

[placement]
scope = "server"
device_ok = false

[[tests]]
name     = "log_inesistente_no_op"
setup    = "rm -f /tmp/metnos_test_undo_log.jsonl"
input    = { log_path = "/tmp/metnos_test_undo_log.jsonl" }
expect   = { ok = true }
teardown = "rm -f /tmp/metnos_test_undo_log.jsonl"

[[tests]]
name     = "ribalta_create_dirs_done"
setup    = """mkdir -p /tmp/metnos_test_undo_dir && rm -f /tmp/metnos_test_undo_log.jsonl && python3 -c "import sys; sys.path.insert(0,'/opt/metnos/runtime'); from undo import UndoLog; from pathlib import Path; log=UndoLog(Path('/tmp/metnos_test_undo_log.jsonl')); log.append_pending('opA','turnX','create_dirs',{'paths':['/tmp/metnos_test_undo_dir']},{}); log.append_done('opA',{'ok':True,'results':[{'path':'/tmp/metnos_test_undo_dir','created':True}],'failed':[]})" """
input    = { log_path = "/tmp/metnos_test_undo_log.jsonl" }
expect   = { ok = true }
teardown = "rm -f /tmp/metnos_test_undo_log.jsonl && rm -rf /tmp/metnos_test_undo_dir"

[[tests]]
name     = "idempotenza_secondo_undo_no_op"
setup    = """rm -f /tmp/metnos_test_undo_log.jsonl && python3 -c "import sys; sys.path.insert(0,'/opt/metnos/runtime'); from undo import UndoLog; from pathlib import Path; log=UndoLog(Path('/tmp/metnos_test_undo_log.jsonl')); log.append_pending('opA','turnX','create_dirs',{},{}); log.append_done('opA',{'ok':True,'results':[{'path':'/tmp/metnos_test_undo_idemp_dir','created':True}],'failed':[]}); log.append_undone('opA',{'ok':True})" """
input    = { log_path = "/tmp/metnos_test_undo_log.jsonl" }
expect   = { ok = true }
teardown = "rm -f /tmp/metnos_test_undo_log.jsonl"
