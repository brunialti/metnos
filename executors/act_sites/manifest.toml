manifest_format = "1.0"
executor_standard = "metnos.executor/1.0"

name        = "act_sites"
version     = "0.3.0"
intelligence = "agentic"
# Four available sessions, each with a ten-minute active search budget.
timeout_s   = 3000
platforms   = ["linux"]
author      = "Roberto Brunialti"
critical    = true
revertible  = false
affinity    = [
    "clicca sul sito", "compila il modulo", "invia il form", "premi il bottone",
    "cerca nel sito", "trova nella dashboard", "naviga nel portale",
    "click on website", "fill the form", "submit form", "press the button",
    "search the site", "find in dashboard", "navigate the portal",
]

[description]
it = "SCOPO: naviga a un fine dentro una sessione web, con conferma se sensibile, o salva un documento dall'azione indicata. PATTERN: act_sites(from_step=2, action=\"fatture 2026\", ambito=\"personale\"); download: action=\"clicca Scarica PDF\", dst_dir=\"/percorso/autorizzato\". NON: pagina senza stato -> read_urls_html; niente CSS/XPath. OUT: results=[{session_id,ok,url}], documenti in entries=[{path,bytes,sha256,session_id}] per read_files; dati incompleti: partial=true e partial_reason."
en = "SCOPO: reach a goal inside a web session, with consent when sensitive, or save a document from the specified action. PATTERN: act_sites(from_step=2, action=\"invoices 2026\", ambito=\"personale\"); download: action=\"click Download PDF\", dst_dir=\"/authorized/path\". NON: stateless page -> read_urls_html; no CSS/XPath. OUT: results=[{session_id,ok,url}], documents in entries=[{path,bytes,sha256,session_id}] for read_files; incomplete data: partial=true and partial_reason."

[code]
files = ["act_sites.py"]
digest = "sha256:d3e84501684a2c29f8a4eb1ed19a4a24ea0c3aa287913cb31753a6f0ca6107f5"

[args]
type = "object"
required = ["session_ids", "action"]

[args.properties.source_metadata]
type = "array"
items = { type = "object" }
runtime_resolved = true
from_result_key = "source_metadata"

[args.properties.source_metadata.description]
it = "Provenienza e incompletezza dichiarate dai produttori runtime. Iniettate automaticamente; non sono dati delle righe né istruzioni del modello."
en = "Provenance and incompleteness declared by runtime producers. Injected automatically; neither row data nor model instructions."

[args.properties.session_ids]
type = "array"
from_entries_key = "session_id"
from_result_key = "session_ids"
[args.properties.session_ids.description]
it = "Sessioni esatte da open_sites o dagli esiti act_sites, anche dopo un download fallito; normalmente via from_step. Mai wildcard."
en = "Exact sessions from open_sites or act_sites results, including failed downloads; normally via from_step. Never wildcards."

[args.properties.action]
type = "string"
[args.properties.action.description]
it = "Il FINE in linguaggio naturale, mai selettori. DEVI nominare la COSA da raggiungere, non solo il verbo: 'le mie prenotazioni', non 'vai'. NON DEVI usare 'mie/miei' per dire dove sta: quello e' il campo `ambito`. DEVI aggiungere il tratto che distingue, se c'e': 'passate', 'future', 'cancellate', un anno. NON DEVI nominare il sito ('su booking'): sulla sua pagina quel nome sta ovunque e non distingue niente. NON DEVI mettere due fini in una chiamata. OK: 'le mie prenotazioni future'. ERRORE: 'vai su booking e guarda'."
en = "The GOAL in natural language, never selectors. DEVI name the THING to reach, not just the verb: 'my bookings', not 'go'. NON DEVI use 'my' to say where it lives: that is the `ambito` field. DEVI add the distinguishing trait when there is one: 'past', 'upcoming', 'cancelled', a year. NON DEVI name the site ('on booking'): on its own pages that name is everywhere and distinguishes nothing. NON DEVI put two goals in one call. OK: 'my upcoming bookings'. ERRORE: 'go to booking and look'."

[args.properties.done_when]
type = "string"
[args.properties.done_when.description]
it = "Come si RICONOSCE di essere arrivati: cosa deve comparire nella pagina. Senza, si riconosce dal fine stesso, che a volte non basta. DEVI descrivere il contenuto atteso, non l'aspetto: 'l'elenco delle prenotazioni con le date', non 'la pagina giusta'. OK: done_when=\"elenco con destinazione e date\". ERRORE: done_when=\"ho finito\"."
en = "How to RECOGNISE arrival: what must appear on the page. Without it, arrival is judged from the goal itself, which is sometimes not enough. DEVI describe the expected content, not the looks: 'the list of bookings with dates', not 'the right page'. OK: done_when=\"list with destination and dates\". ERRORE: done_when=\"I am done\"."

[args.properties.ambito]
type = "string"
enum = ["personale", "pubblico"]
[args.properties.ambito.description]
it = "DOVE sta il fine: 'personale' se la cosa e' nell'area dell'utente (le sue prenotazioni, i suoi ordini, il suo profilo), 'pubblico' se e' una parte del sito visibile a chiunque. DEVI dichiararlo quando lo sai: apre il menu dell'account invece di cercare in home, e non dipende da come e' scritta la frase. Senza, si prova a dedurlo dal possesso ('le MIE ...'), che spesso non c'e'. OK: ambito=\"personale\". ERRORE: ambito=\"account\"."
en = "WHERE the goal lives: 'personale' when the thing is in the user's own area (their bookings, their orders, their profile), 'pubblico' when it is a part of the site anyone can see. DEVI declare it when you know it: it opens the account menu instead of searching the home page, and it does not depend on how the sentence is worded. Without it, the scope is guessed from possession ('MY ...'), which is often absent. OK: ambito=\"personale\". ERRORE: ambito=\"account\"."

[args.properties.value_ref]
type = "string"
[args.properties.value_ref.description]
it = "Opzionale. Valore da inserire; per credenziali usare cred:<dominio>:<campo>. Il broker sceglie autonomamente il campo."
en = "Optional. Value to enter; for credentials use cred:<domain>:<field>. The broker selects the field itself."

[args.properties.dst_dir]
type = "string"
[args.properties.dst_dir.description]
it = "Cartella assoluta esistente e autorizzata dove salvare il documento scaricato dall'azione. Il consenso comprende destinazione e limiti."
en = "Existing authorized absolute directory for the document downloaded by this action. Approval binds destination and limits."

[args.properties.download_limits]
type = "object"
[args.properties.download_limits.properties.max_file_bytes]
type = "integer"
minimum = 1
maximum = 33554432
[args.properties.download_limits.properties.max_total_bytes]
type = "integer"
minimum = 1
maximum = 268435456
[args.properties.download_limits.properties.max_files]
type = "integer"
minimum = 1
maximum = 100
[args.properties.download_limits.properties.timeout_s]
type = "integer"
minimum = 1
maximum = 120
[args.properties.download_limits.description]
it = "Limiti riducibili: massimo 32 MiB per file, 256 MiB totali, 100 file e 120 secondi."
en = "Narrowable limits: at most 32 MiB per file, 256 MiB total, 100 files and 120 seconds."

[args.properties.approval_tokens]
type = "object"
runtime_resolved = true
[args.properties.approval_tokens.description]
it = "Solo runtime: token opachi emessi dal broker e ripresentati dopo approvazione."
en = "Runtime only: opaque tokens issued by the broker and replayed after approval."

[args.properties.continuation_ids]
type = "object"
runtime_resolved = true
from_result_key = "continuation_ids"
[args.properties.continuation_ids.description]
it = "Solo runtime: ricevute opache per sessione, restituite anche dal download per recuperare lo stesso file senza ripetere l'azione."
en = "Runtime only: opaque receipts per session, also returned by downloads to recover the same file without replaying the action."

[args.properties._goal_mode]
type = "boolean"
runtime_resolved = true
[args.properties._goal_mode.description]
it = "Solo runtime: interpreta action come fine semantico da raggiungere prima della lettura."
en = "Runtime only: treat action as the semantic goal to reach before reading."

[args.properties._record_mode]
type = "boolean"
runtime_resolved = true
[args.properties._record_mode.description]
it = "Solo runtime: osservazione dei record richiesta da una lettura ed estrazione collegate; non dichiara la raccolta completa."
en = "Runtime only: record observation required by a linked read and extraction; does not declare collection completeness."

[output]
schema_inline = """
{ok: bool, partial?: bool, partial_reason?: str, collection_partial?: bool, session_ids?: Array<str>, continuation_ids?: object, results: Array<{session_id: str, ok: bool, executed: bool, primitive?: str, url?: str, text?: str, collection_partial?: bool, reason_code?: str, automatic_resume_blocked?: bool}>, entries?: Array<{path: str, bytes: int, sha256: str, media_type: str, session_id: str, source_url: str, action_id: str, state: str}>}
"""

[[capabilities]]
name = "network:sites"
hint = ["*"]

[[capabilities]]
name = "dialog.user_input"
hint = []

[[capabilities]]
name = "fs:write"
hint = ["~/notes/scratch/**", "/tmp/**", "arg:dst_dir"]
path_args = ["dst_dir"]
when = { arg = "dst_dir", nonempty = true }

[[tests]]
name = "manca_session_ids"
input = { action = "clicca Accedi" }
expect = { ok = false, field_eq = { error_class = "invalid_args" } }

[[tests]]
name = "manca_action"
input = { session_ids = ["abc"] }
expect = { ok = false, field_eq = { error_class = "invalid_args" } }

[placement]
scope = "server"
device_ok = false

[execution]
effect = "interactive"
parallelism_class = 0
resource_class = "browser"
concurrency_key = "browser_session"
equivalence_gate = "unverified"
