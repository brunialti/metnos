# Manifest dell'executor `create_dirs` — Metnos v1.1
# Naming compositivo: verbo_oggetto_plurale. Vettoriale per costruzione.
# Sostituisce `create_dir` (single-item) il 27 aprile 2026.

manifest_format = "1.0"
executor_standard = "metnos.executor/1.0"

name        = "create_dirs"
version     = "0.7.0"
platforms   = ["linux", "windows"]
author      = "Roberto Brunialti"
affinity    = [
    "create", "crea", "mkdir", "make", "nuova", "directory", "cartella", "subdir", "folder",
                "batch"
            ]
revertible      = true
reverse_pattern = "delete_created_paths"

[description]
it = "SCOPO: crea directory (batch, anche vuote). PATTERN: create_dirs(paths=[\"/tmp/d\"]); una per riga di uno step: create_dirs(from_step=1, path_template=\"{partition}/d\"). NON: cancellare (-> delete_dirs); cercare (-> find_dirs). OUT: results=[{created}], best-effort."
en = "SCOPO: create directories (batch, even empty). PATTERN: create_dirs(paths=[\"/tmp/d\"]); one per row of a step: create_dirs(from_step=1, path_template=\"{partition}/d\"). NON: delete (-> delete_dirs); search (-> find_dirs). OUT: results=[{created}], best-effort."

[code]
files  = ["create_dirs.py"]
digest = "sha256:6fa454133f8eeea87fd9448cf0dff421c6809175970263980be30b1748049b81"

[args]
type     = "object"
required = []
requires_one_of = [["paths", "from_step", "entries"]]
# Le righe di uno step arrivano intere in `entries`, per `path_template`:
# i loro `path` sono file o cartelle esistenti, non le cartelle da creare.
from_step_alternatives = ["entries"]

[args.properties.from_step]
type        = "integer"
minimum     = 1

[args.properties.from_step.description]
it = "Intero >=1 dello step precedente; il runtime ne passa le righe in `entries`. Si usa con `path_template`, es. `from_step=1`."
en = "Integer >=1 for the previous step; the runtime passes its rows in `entries`. Used with `path_template`, e.g. `from_step=1`."

[args.properties.entries]
type        = "array"
items       = { type = "object" }
runtime_resolved = true

[args.properties.entries.description]
it = "Righe risolte dal runtime; ogni riga fornisce i campi di testo usati da `path_template`."
en = "Runtime-resolved rows; each row provides the text fields used by `path_template`."

[args.properties.path_template]
type        = "string"

[args.properties.path_template.description]
it = "Modello del percorso da creare per ogni riga, con i campi di testo della riga tra graffe, es. `{partition}/da_controllare`. Crea una cartella per ogni valore diverso. Default: nessuno."
en = "Template of the path to create for each row, with the row's text fields in braces, e.g. `{partition}/to_check`. Creates one folder for each different value. Default: none."

[args.properties.paths]
type        = "array"
items       = { type = "string" }

[args.properties.paths.description]
it = "Lista di path di directory da creare. Path assoluti o ~ espandibile. Tutti devono essere dentro lo scope fs:write autorizzato. Esempio: [\"/home/user/images/2026\", \"/home/user/images/2025\"]."
en = "List of directory paths to create. Absolute paths or expandable ~. All must be within the authorized fs:write scope. Example: [\"/home/user/images/2026\", \"/home/user/images/2025\"]."

[args.properties.parents]
type        = "boolean"
default     = true

[args.properties.parents.description]
it = "Se true (default), crea le dir intermedie mancanti per ogni path (come `mkdir -p`)."
en = "If true (default), create the missing intermediate dirs for every path (as `mkdir -p`)."

[args.properties.exist_ok]
type        = "boolean"
default     = true

[args.properties.exist_ok.description]
it = "Se true (default), non fallisce se una dir esiste gia'."
en = "If true (default), it does not fail if a dir already exists."

[args.properties.mode]
type        = "integer"

[args.properties.mode.description]
it = "Permessi delle nuove directory (formato decimale, es. 493 per 0o755). Default: umask del processo."
en = "Permissions for the new directories (decimal format, e.g., 493 for 0o755). Default: process umask."

[args.properties.client]
type        = "string"
# dirs mono→multi (7/7/2026): l'executor ha il lazy-gw da C7 Area-2 CP4,
# l'owner runtime è backend_resolver.OBJECT_BACKENDS["dirs"] (default local
# §10.3, gw solo se nominato). Multi-provider = clause-derived, NON
# runtime_resolved (politica test_config_args_marking_policy).
enum        = ["local", "google_workspace"]
default     = "local"

[args.properties.client.description]
it = "Implementazione backend (default 'local' = filesystem locale). Plugin esterni futuri (gdrive, dropbox, ecc.) potranno aggiungere altri client."
en = "Backend implementation (default 'local' = local filesystem). Future external plugins (gdrive, dropbox, etc.) may add other clients."

[output]
schema_inline = """
{
  ok: bool,
  ok_count: int,
  fail_count: int,
  partial?: bool,
  results: Array<{path: str, created: bool, mode_octal?: str}>,
  failed: Array<{index: int, path, error_code?: str, error: str}>,
  error_class?: str,
  error_code?: str,
  error?: str
}
"""

[[capabilities]]
name = "fs:write"
hint = ["~/notes/**", "/tmp/**"]

[[capabilities]]
name = "provider:access"
hint = ["google-workspace"]
when = { arg = "client", values = ["google_workspace"] }

[[tests]]
name     = "crea_lista_di_dirs"
setup    = "rm -rf /tmp/metnos_test_create_dirs"
input    = { paths = ["/tmp/metnos_test_create_dirs/a", "/tmp/metnos_test_create_dirs/b/c"] }
expect   = { ok = true, ok_count_eq = 2, fail_count_eq = 0 }
teardown = "rm -rf /tmp/metnos_test_create_dirs"

[[tests]]
name     = "una_cartella_per_valore_del_modello"
setup    = "rm -rf /tmp/metnos_test_create_dirs && mkdir -p /tmp/metnos_test_create_dirs/a /tmp/metnos_test_create_dirs/b"
input    = { entries = [{partition = "/tmp/metnos_test_create_dirs/a"}, {partition = "/tmp/metnos_test_create_dirs/a"}, {partition = "/tmp/metnos_test_create_dirs/b"}], path_template = "{partition}/nuova" }
expect   = { ok = true, ok_count_eq = 2, fail_count_eq = 0 }
teardown = "rm -rf /tmp/metnos_test_create_dirs"

[[tests]]
name     = "lista_di_uno"
setup    = "rm -rf /tmp/metnos_test_create_dirs"
input    = { paths = ["/tmp/metnos_test_create_dirs/solo"] }
expect   = { ok = true, ok_count_eq = 1 }
teardown = "rm -rf /tmp/metnos_test_create_dirs"

[[tests]]
name   = "lista_vuota_ok"
input  = { paths = [] }
expect = { ok = true, ok_count_eq = 0, fail_count_eq = 0 }

[[tests]]
name     = "exist_ok_default_true"
setup    = "mkdir -p /tmp/metnos_test_create_dirs/already"
input    = { paths = ["/tmp/metnos_test_create_dirs/already"] }
expect   = { ok = true, ok_count_eq = 1 }
teardown = "rm -rf /tmp/metnos_test_create_dirs"

[[tests]]
name     = "best_effort_alcuni_falliscono"
setup    = "rm -rf /tmp/metnos_test_create_dirs && mkdir -p /tmp/metnos_test_create_dirs && touch /tmp/metnos_test_create_dirs/file"
input    = { paths = ["/tmp/metnos_test_create_dirs/ok", "/tmp/metnos_test_create_dirs/file"] }
expect   = { ok = false, ok_count_eq = 1, fail_count_eq = 1 }
teardown = "rm -rf /tmp/metnos_test_create_dirs"

[[tests]]
name   = "blocca_path_fuori_scope"
input  = { paths = ["/etc/myclaw_test"] }
expect = { ok = false, error_contains = "outside allowed scope" }

[[tests]]
name   = "args_invalidi_paths_non_lista"
input  = { paths = "/tmp/foo" }
expect = { ok = false, error_contains = "must be a list" }

[placement]
# C7 Area-2 estensione (5/7 sera): mutante con reverse remotabile
# (delete_created_dirs → delete_dirs con force=false accodato allo stesso
# device da undo_last_turn, ADR 0183 D2).
scope    = "any"
device_ok = true
min_sandbox = "appcontainer"

# A folder outside this tool's own scope (the person's working folder, a
# folder granted to the account) is created on the server by the closed
# operation, with the right a write needs. Read by the server only: a device
# runs the tool.
[filesystem_server]
protocol  = "filesystem_broker_v1"
operation = "mkdir"
