[Unit]
# Evita restart storm se un altro processo occupa nuovamente la porta.
StartLimitIntervalSec=300
StartLimitBurst=3

[Service]
RestartSec=10s
# La porta 8888 e' riservata al SearXNG di sistema. Fallire prima del bootstrap
# produce un errore esplicito e il rate limit sopra impedisce loop infiniti.
ExecStartPre=/usr/bin/bash -c 'if /usr/bin/ss -H -ltn "sport = :8888" | /usr/bin/grep -q .; then /usr/bin/echo "SearXNG port guard: TCP 8888 already occupied" >&2; exit 1; fi'
