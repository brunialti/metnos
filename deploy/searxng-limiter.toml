[botdetection]
ipv4_prefix = 32
ipv6_prefix = 48

# Questa istanza riceve direttamente le richieste locali/LAN, senza reverse
# proxy davanti a SearXNG. Non aggiungere reti proxy oltre ai default dello
# schema upstream; l'eventuale warning iniziale usa comunque REMOTE_ADDR.
trusted_proxies = []

[botdetection.ip_limit]
filter_link_local = false
link_token = false

[botdetection.ip_lists]
block_ip = []
pass_ip = [
  "127.0.0.0/8",
  "::1",
  "192.168.1.0/24",
]
pass_searxng_org = false
